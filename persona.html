<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 20px;">
            <div class="page animate-fade anim-slide-right">
                <header class="header animate-slide-up hover-scale"
                    style="text-align: center; margin-bottom: var(--spacing-xl); padding-top: 40px;">
                    <h1 class="italic-title" style="font-size: 2.8rem; line-height: 1;">WHOSE RING-<br>PRESENCE<br><span
                            class="text-primary-italic">DO YOU ADMIRE?</span></h1>
                    <p style="color: var(--text-muted); margin-top: 20px; font-size: 1.1rem;">Tailoring your mindset and
                        movement drills.</p>
                </header>

                <main class="animate-slide-up hover-scale" style="animation-delay: 0.1s;">
                    <div class="persona-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <!-- Tyson Card -->
                        <div class="glass-card persona-card" onclick="selectPersona(this, 'Tyson')"
                            style="height: 240px; border-radius: 40px; padding: 0; overflow: hidden; position: relative; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9)), url('assets/tyson.png') center/cover;">
                            <div style="position: absolute; bottom: 25px; width: 100%; text-align: center;">
                                <div
                                    style="color: var(--primary); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px;">
                                    POWERHOUSE</div>
                                <h3
                                    style="font-style: italic; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;">
                                    TYSON</h3>
                            </div>
                        </div>

                        <!-- Ali Card -->
                        <div class="glass-card persona-card selected" onclick="selectPersona(this, 'Ali')"
                            style="height: 240px; border-radius: 40px; padding: 0; overflow: hidden; position: relative; border: 2px solid var(--primary); box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.4); background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9)), url('assets/ali.png') center/cover;">
                            <div style="position: absolute; bottom: 25px; width: 100%; text-align: center;">
                                <div
                                    style="color: var(--primary); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px;">
                                    SPECIALIST</div>
                                <h3
                                    style="font-style: italic; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;">
                                    ALI</h3>
                            </div>
                        </div>

                        <!-- Canelo Card -->
                        <div class="glass-card persona-card" onclick="selectPersona(this, 'Canelo')"
                            style="height: 240px; border-radius: 40px; padding: 0; overflow: hidden; position: relative; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9)), url('assets/canelo.png') center/cover;">
                            <div style="position: absolute; bottom: 25px; width: 100%; text-align: center;">
                                <div
                                    style="color: var(--text-muted); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px;">
                                    COUNTER</div>
                                <h3
                                    style="font-style: italic; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;">
                                    CANELO</h3>
                            </div>
                        </div>

                        <!-- Loma Card -->
                        <div class="glass-card persona-card" onclick="selectPersona(this, 'Loma')"
                            style="height: 240px; border-radius: 40px; padding: 0; overflow: hidden; position: relative; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.9)), url('assets/loma.png') center/cover;">
                            <div style="position: absolute; bottom: 25px; width: 100%; text-align: center;">
                                <div
                                    style="color: var(--text-muted); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px;">
                                    TECHNICIAN</div>
                                <h3
                                    style="font-style: italic; font-weight: 900; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px;">
                                    LOMA</h3>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 50px; text-align: center;">
                        <button id="next-btn" class="btn-primary ripple"
                            style="width: 100%; height: 75px; border-radius: 100px; font-size: 1.2rem;">
                            ESTABLISH IDENTITY
                        </button>
                    </div>
                </main>
            </div>
        </div>

        <style>
            .persona-card {
                cursor: pointer;
                transition: all 0.3s ease;
                border: 2px solid transparent;
            }

            .persona-card.selected {
                border-color: var(--primary) !important;
                box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.5);
                transform: scale(1.02);
            }

            .ripple-surface {
                position: absolute;
                border-radius: 50%;
                transform: scale(0);
                animation: ripple 600ms linear;
                background-color: rgba(255, 255, 255, 0.7);
            }

            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        </style>

        <script>
            let selectedPersona = 'Tyson';

            function selectPersona(el, persona) {
                document.querySelectorAll('.persona-card').forEach(card => {
                    card.classList.remove('selected');
                    const badge = card.querySelector('.badge');
                    if (badge) badge.remove();
                });

                el.classList.add('selected');
                selectedPersona = persona;

                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.style = 'position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #000; font-weight: 950; font-size: 0.6rem; padding: 4px 12px; border-radius: 4px; text-transform: uppercase; z-index: 10;';
                badge.innerText = 'SELECTED';
                el.insertBefore(badge, el.firstChild);
            }

            // Initial selection for Ali card (if it was selected by default)
            document.addEventListener('DOMContentLoaded', () => {
                const aliCard = document.querySelector('.persona-card[onclick*="Ali"]');
                if (aliCard && aliCard.classList.contains('selected')) {
                    selectPersona(aliCard, 'Ali');
                } else {
                    // If no card is initially selected, select Tyson as per the script's default
                    const tysonCard = document.querySelector('.persona-card[onclick*="Tyson"]');
                    if (tysonCard) {
                        selectPersona(tysonCard, 'Tyson');
                    }
                }
            });


            document.getElementById('next-btn').onclick = function (e) {
                createRipple(e);
                const profile = JSON.parse(localStorage.getItem('boxing_onboarding_data') || '{}');
                profile.persona = selectedPersona;
                localStorage.setItem('boxing_onboarding_data', JSON.stringify(profile));

                setTimeout(() => {
                    window.location.href = 'goals.html';
                }, 400);
            };

            function createRipple(event) {
                const button = event.currentTarget;
                const circle = document.createElement("span");
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - button.offsetLeft - radius}px`;
                circle.style.top = `${event.clientY - button.offsetTop - radius}px`;
                circle.classList.add("ripple-surface");

                const ripple = button.getElementsByClassName("ripple-surface")[0];
                if (ripple) { ripple.remove(); }
                button.appendChild(circle);
            }
        </script>
    </div>
    </div>
    </div>
</body>

</html>
