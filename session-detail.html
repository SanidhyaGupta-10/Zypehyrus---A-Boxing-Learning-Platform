<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Details - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .drill-item-v3 {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .drill-item-v3.completed {
            background: rgba(var(--primary-rgb), 0.1);
            border-color: rgba(var(--primary-rgb), 0.3);
        }

        .check-ico {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .missed-ico {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            color: #666;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>

<body style="background: #000;">
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained"
            style="padding: 20px 24px 40px; height: 100%; display: flex; flex-direction: column;">
            <div class="page page-transition" style="padding-bottom: 50px; padding-top: 30px;">

                <!-- Header -->
                <header style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                    <div class="action-circle ripple hover-scale" onclick="history.back()"
                        style="width: 50px; height: 50px; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </div>
                    <div>
                        <div class="hero-sub-text" id="session-date">DATE</div>
                        <h1 class="hero-main-title" style="font-size: 1.5rem;" id="session-title">SESSION<br>REPORT</h1>
                    </div>
                </header>

                <!-- Stats Summary -->
                <div style="display: flex; gap: 15px; margin-bottom: 30px;">
                    <div
                        style="flex:1; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; text-align: center;">
                        <div style="font-size: 0.6rem; font-weight: 800; color: #666; letter-spacing: 1px;">COMPLETED
                        </div>
                        <div style="font-size: 1.8rem; font-weight: 950; color: var(--primary);" id="completed-count">0
                        </div>
                    </div>
                    <div
                        style="flex:1; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; text-align: center;">
                        <div style="font-size: 0.6rem; font-weight: 800; color: #666; letter-spacing: 1px;">TOTAL</div>
                        <div style="font-size: 1.8rem; font-weight: 950; color: #fff;" id="total-count">0</div>
                    </div>
                </div>

                <!-- Drill List -->
                <h3
                    style="color: #fff; font-size: 1rem; font-weight: 950; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px;">
                    Drill Breakdown</h3>
                <div id="drill-list">
                    <!-- Injected via JS -->
                </div>

            </div>
        </div>

        <script src="workout-data.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const urlParams = new URLSearchParams(window.location.search);
                const dateStr = urlParams.get('date');

                if (!dateStr) {
                    alert("No date specified");
                    window.history.back();
                    return;
                }

                // Reconstruct Date
                const date = new Date(dateStr);
                const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                const dayName = dayNames[date.getDay()];

                // UI Header
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('session-date').innerText = date.toLocaleDateString('en-US', options).toUpperCase();

                // Get Data
                const workout = workoutSchedule[dayName]; // Assuming cyclic schedule for now
                const progressKey = 'workout_progress_' + date.toDateString();
                const completedIndices = JSON.parse(localStorage.getItem(progressKey) || '[]');

                if (workout) {
                    document.getElementById('session-title').innerHTML = workout.title.replace(' ', '<br>');
                    document.getElementById('completed-count').innerText = completedIndices.length;
                    document.getElementById('total-count').innerText = workout.drills.length;

                    const list = document.getElementById('drill-list');

                    workout.drills.forEach((drill, index) => {
                        const isCompleted = completedIndices.includes(index);

                        const el = document.createElement('div');
                        el.className = `drill-item-v3 ${isCompleted ? 'completed' : ''}`;
                        el.innerHTML = `
                        <div class="${isCompleted ? 'check-ico' : 'missed-ico'}">
                            <i class="fa-solid ${isCompleted ? 'fa-check' : 'fa-xmark'}"></i>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-weight: 950; font-size: 1rem; text-transform: uppercase; color: #fff;">${drill.name}</div>
                            <div style="font-size: 0.7rem; font-weight: 800; color: ${isCompleted ? 'var(--primary)' : '#666'};">
                                ${drill.reps || (drill.duration + 's')}
                            </div>
                        </div>
                    `;
                        list.appendChild(el);
                    });
                } else {
                    document.getElementById('drill-list').innerHTML = "<div style='color:#666; text-align:center;'>No workout data found for this schema.</div>";
                }
            });
        </script>
    </div>
    </div>
</body>

</html>
