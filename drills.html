<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Grind - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background: #000;">
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 20px;">
            <div class="page page-transition" style="padding-top: 40px; padding-bottom: 150px;">
                <!-- Unified Header -->
                <header
                    style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
                    <div class="hero-container animate-float">
                        <div
                            style="width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--primary); padding: 4px; box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.3);">
                            <img src="https://i.pravatar.cc/150?u=viktor"
                                style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                        </div>
                        <div>
                            <div class="hero-sub-text">VOLUME 04</div>
                            <h1 class="hero-main-title">TODAY'S<br>GRIND</h1>
                        </div>
                    </div>
                    <div class="action-circle hover-scale" onclick="location.href='settings.html'"
                        style="width: 50px; height: 50px; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer;">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                </header>

                <!-- Progress Ring Section -->
                <div style="display: flex; justify-content: center; margin-bottom: 60px;">
                    <div class="progress-ring animate-float"
                        style="width: 250px; height: 250px; background: conic-gradient(var(--primary) 235deg, rgba(255,255,255,0.05) 0deg); box-shadow: 0 0 40px rgba(var(--primary-rgb), 0.1);">
                        <div class="val" style="font-size: 4rem; font-weight: 950; font-style: italic;">66%<br><span
                                style="font-size: 0.8rem; font-style: normal; opacity: 0.7; letter-spacing: 2px;">DONE</span>
                        </div>
                    </div>
                </div>

                <!-- List Section -->
                <div class="stagger-anim">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px;">
                        <p
                            style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; font-weight: 800; color: #444;">
                            THE DRILL DOWN</p>
                        <p style="color: var(--primary); font-size: 0.75rem; font-weight: 950;">2 / 3 COMPLETED</p>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="glass-card ripple hover-scale"
                            style="padding: 20px; border-radius: 30px; display: flex; align-items: center; gap: 20px; border-color: rgba(var(--primary-rgb), 0.1);">
                            <div
                                style="width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #000;">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div style="flex: 1;">
                                <div style="font-weight: 950; font-size: 1.1rem; text-transform: uppercase;">PUSH-UPS
                                </div>
                                <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary);">50 REPS <span
                                        style="color: #444;">DONE</span></div>
                            </div>
                            <div class="set-pill">SET 5/5</div>
                        </div>

                        <div class="glass-card ripple hover-scale"
                            style="padding: 20px; border-radius: 30px; display: flex; align-items: center; gap: 20px; border-color: rgba(var(--primary-rgb), 0.1);">
                            <div
                                style="width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #000;">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div style="flex: 1;">
                                <div style="font-weight: 950; font-size: 1.1rem; text-transform: uppercase;">SIT-UPS
                                </div>
                                <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary);">100 REPS <span
                                        style="color: #444;">DONE</span></div>
                            </div>
                            <div class="set-pill">SET 4/4</div>
                        </div>

                        <div class="glass-card ripple hover-scale active"
                            style="padding: 20px; border-radius: 30px; display: flex; align-items: center; gap: 20px;">
                            <div class="pulse-ico" style="width: 45px; height: 45px;"></div>
                            <div style="flex: 1;">
                                <div style="font-weight: 950; font-size: 1.1rem; text-transform: uppercase;">SHADOW
                                    BOXING
                                </div>
                                <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary);">3 ROUNDS <span
                                        style="color: #ff2d55;">ACTIVE</span></div>
                            </div>
                            <button class="btn ripple"
                                style="width: auto; height: 40px; padding: 0 20px; font-size: 0.7rem; background: var(--primary); color: #000; border-radius: 12px; font-weight: 950;">START</button>
                        </div>
                    </div>
                </div>

            </div>
            <!-- Persistent Navigation Bar -->
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-house"></i>
                    <span>HOME</span>
                </a>
                <a href="analytics.html" class="nav-link">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>ANALYSIS</span>
                </a>
                <a href="guru.html" class="nav-link">
                    <i class="fa-solid fa-robot"></i>
                    <span>GURU</span>
                </a>

                <div class="nav-hex-wrap" onclick="location.href='vision-analyser.html'">
                    <div class="nav-hex">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="nav-hex-label">VIDEO</span>
                </div>

                <a href="reflex-enhancer.html" class="nav-link">
                    <i class="fa-solid fa-bolt"></i>
                    <span>REFLEX</span>
                </a>
                <a href="planner.html" class="nav-link">
                    <i class="fa-solid fa-calendar-check"></i>
                    <span>PLANNER</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <i class="fa-solid fa-user"></i>
                    <span>PROFILE</span>
                </a>
            </nav>
        </div>
    </div>
    </div>
    </div>
</body>

</html>
