<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile Identity - AI Boxing Protocol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" crossorigin href="/assets/style-Dx3LiayG.css">
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header" style="text-align: left; margin-bottom: 20px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 15px; text-transform: uppercase;">
                        ONBOARDING 01/10</div>
                    <h1 style="font-size: 2.8rem; font-weight: 700; line-height: 1; color: var(--text);">Fighter
                        <br><span class="text-neon" style="font-style: italic;">Identity</span>
                    </h1>
                    <p
                        style="color: var(--text-muted); margin-top: 20px; font-size: 0.95rem; line-height: 1.5; padding-right: 20px;">
                        Establish your visual presence in the global rankings. Take a combat-ready photo or upload your
                        avatar.</p>
                </header>

                <main
                    style="animation-delay: 0.1s; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;">
                    <div class="avatar-view-container" style="position: relative;">
                        <div id="avatar-preview"
                            style="width: 200px; height: 200px; border-radius: 50%; border: 3px solid var(--primary); background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.2);">
                            <i class="fa-solid fa-user-ninja" id="placeholder-icon"
                                style="font-size: 5rem; color: #333;"></i>
                            <video id="camera-feed" style="display: none; width: 100%; height: 100%; object-fit: cover;"
                                autoplay playsinline></video>
                            <img id="custom-avatar"
                                style="display: none; width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div id="capture-flash"
                            style="position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; border-radius: 50%; transition: opacity 0.1s;">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
                        <button id="click-photo-btn" class="btn-outline hover-scale"
                            style="width: 100%; padding: 18px; border-radius: 100px; font-weight: 800; font-size: 0.8rem; border-color: var(--primary); color: var(--primary);">
                            <i class="fa-solid fa-camera" style="margin-right: 10px;"></i> TAKE A PHOTO
                        </button>
                        <button id="upload-photo-btn" class="btn-outline hover-scale"
                            style="width: 100%; padding: 18px; border-radius: 100px; font-weight: 800; font-size: 0.8rem;">
                            <i class="fa-solid fa-cloud-arrow-up" style="margin-right: 10px;"></i> FROM GALLERY
                        </button>
                        <input type="file" id="file-input" accept="image/*" style="display: none;">
                    </div>
                </main>

                <footer style="margin-top: 30px; text-align: center;">
                    <button class="btn-primary hover-scale" id="next-btn"
                        style="width: 100%; height: 75px; font-size: 1.3rem; border-radius: 100px;">
                        CONTINUE <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                    </button>
                    <p style="margin-top: 15px; font-size: 0.85rem; color: #666;">
                        You can update this later in PROFILE.
                    </p>
                </footer>
            </div>
        </div>
    </div>

    <script>
        const clickBtn = document.getElementById('click-photo-btn');
        const uploadBtn = document.getElementById('upload-photo-btn');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('avatar-preview');
        const video = document.getElementById('camera-feed');
        const customImg = document.getElementById('custom-avatar');
        const placeholderIcon = document.getElementById('placeholder-icon');
        const nextBtn = document.getElementById('next-btn');
        const flash = document.getElementById('capture-flash');

        let cameraActive = false;

        // Upload Logic
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    saveAvatar(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Camera Logic
        clickBtn.addEventListener('click', async () => {
            if (!cameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: true
                    });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    placeholderIcon.style.display = 'none';
                    customImg.style.display = 'none';
                    clickBtn.innerHTML = '<i class="fa-solid fa-circle-dot"></i> CAPTURE';
                    cameraActive = true;
                } catch (err) {
                    alert('Camera access denied or unavailable.');
                }
            } else {
                capturePhoto();
            }
        });

        function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            const dataUrl = canvas.toDataURL('image/jpeg');

            // Flash effect
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 100);

            stopCamera();
            saveAvatar(dataUrl);
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            video.style.display = 'none';
            cameraActive = false;
            clickBtn.innerHTML = '<i class="fa-solid fa-camera"></i> TAKE A PHOTO';
        }

        function saveAvatar(dataUrl) {
            customImg.src = dataUrl;
            customImg.style.display = 'block';
            placeholderIcon.style.display = 'none';
            localStorage.setItem('boxing_user_avatar', dataUrl);
        }

        nextBtn.addEventListener('click', () => {
            window.location.href = 'bio-metrics.html';
        });
    </script>
</body>

</html>
