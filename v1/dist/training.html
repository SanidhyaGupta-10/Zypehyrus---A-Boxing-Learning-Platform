    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .progress-circle-v3 {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(closest-side, #000 79%, transparent 80% 100%),
                conic-gradient(var(--primary) 66%, rgba(255, 255, 255, 0.05) 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 40px auto;
            position: relative;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.1);
        }

        .progress-circle-v3::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(var(--primary-rgb), 0.05);
        }

        .drill-item-v3 {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: 0.3s;
        }

        .drill-item-v3.active {
            background: rgba(var(--primary-rgb), 0.02);
            border-color: rgba(var(--primary-rgb), 0.1);
        }

        .check-ico {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .pulse-ico {
            width: 45px;
            height: 45px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pulse-ico::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0.7);
            }

            70% {
                transform: scale(1.5);
                opacity: 1;
                box-shadow: 0 0 0 10px rgba(var(--primary-rgb), 0);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0);
            }
        }

        .set-pill {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 800;
            color: #888;
            margin-left: auto;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            padding: 30px;
            margin-top: 40px;
            font-style: italic;
            border-left: 3px solid var(--primary);
        }

        .linear-progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 30px 0;
            overflow: hidden;
            position: relative;
        }

        .linear-progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.5);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .planner-glow {
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.15) 0%, rgba(0, 0, 0, 0.3) 100%) !important;
            border: 2px solid var(--primary) !important;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.3), inset 0 0 15px rgba(var(--primary-rgb), 0.1);
            position: relative;
            overflow: hidden;
            transform: scale(1.02);
            z-index: 10;
        }

        .planner-glow::before {
            content: 'STRATEGIC';
            position: absolute;
            top: 8px;
            right: -25px;
            background: var(--primary);
            color: #000;
            font-size: 0.55rem;
            font-weight: 950;
            padding: 3px 30px;
            transform: rotate(45deg);
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = currentDayName;
            let workout = getDailyWorkout();

            if (workout) {
                document.getElementById('workout-day-label').innerText = today.toUpperCase();
                document.getElementById('workout-title').innerHTML = workout.title.replace(': ', '<br>').replace(' ', '<br>');

                const list = document.getElementById('drill-list-container');
                list.innerHTML = '';

                // Load Progress
                const progressKey = 'workout_progress_' + new Date().toDateString();
                const completedIndices = JSON.parse(localStorage.getItem(progressKey) || '[]');

                let completedCount = 0;

                workout.drills.forEach((drill, index) => {
                    const isComplete = completedIndices.includes(index);
                    if (isComplete) completedCount++;

                    const div = document.createElement('div');
                    div.className = `drill-item-v3 ripple hover-scale ${isComplete ? 'completed' : ''} ${drill.isPlanner ? 'planner-glow' : ''}`;
                    div.onclick = () => {
                        window.location.href = `session-timer.html?index=${index}`;
                    };

                    div.innerHTML = `
                        <div class="${isComplete ? 'check-ico' : 'pulse-ico'}">
                            ${isComplete ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <div style="flex: 1;">
                            <div style="font-weight: 950; font-size: 1.1rem; text-transform: uppercase; color: #fff;">${drill.name}</div>
                            <div style="font-size: 0.7rem; font-weight: 800; color: var(--primary);">
                                ${drill.reps || (drill.duration + 's')} 
                                <span style="color: ${isComplete ? '#444' : '#ff2d55'};">${isComplete ? 'DONE' : 'READY'}</span>
                            </div>
                        </div>
                        <div class="set-pill"><i class="fa-solid fa-chevron-right"></i></div>
                    `;
                    list.appendChild(div);
                });

                // Update Progress Bar
                const percent = Math.round((completedCount / workout.drills.length) * 100) || 0;

                document.getElementById('progress-percent-text').innerText = `${percent}%`;
                setTimeout(() => {
                    document.getElementById('progress-fill').style.width = `${percent}%`;
                }, 100);

                document.getElementById('drill-count').innerText = `${completedCount} / ${workout.drills.length} COMPLETED`;

                // Update Session Streak
                if (completedCount > 0 && window.StreakManager) {
                    StreakManager.completeSession();
                }

            } else {
                document.getElementById('workout-title').innerText = "REST DAY";
                document.getElementById('drill-list-container').innerHTML = "<div style='text-align:center; padding: 40px; color: #666;'>Enjoy your recovery.</div>";
            }
        });
    </script>
