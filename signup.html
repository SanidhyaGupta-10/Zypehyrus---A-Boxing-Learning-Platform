<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 20px;">
            <div class="page animate-fade anim-slide-right"
                style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">
                <header class="header animate-slide-up hover-scale">
                    <div style="font-size: 3rem; margin-bottom: var(--spacing-md); color: var(--primary);">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="text-gradient">Create Account</h1>
                    <p>Join the elite. Your training data will be synced to our cloud strategist.</p>
                </header>

                <main class="animate-slide-up hover-scale" style="animation-delay: 0.1s;">
                    <div class="glass-card">
                        <div class="input-group">
                            <label class="input-label" for="email">Email Address</label>
                            <input type="email" id="email" class="input-field" placeholder="champion@boxing.com">
                        </div>

                        <div class="input-group">
                            <label class="input-label" for="password">Create Password</label>
                            <input type="password" id="password" class="input-field" placeholder="••••••••">
                        </div>

                        <button class="btn btn-primary" id="signup-btn" style="width: 100%; height: 55px;">
                            CREATE ACCOUNT <i class="fa-solid fa-check"></i>
                        </button>

                        <div id="error-msg"
                            style="color: #ff4747; font-size: 0.8rem; text-align: center; margin-top: 10px; display: none;">
                        </div>
                    </div>

                    <p
                        style="text-align: center; margin-top: var(--spacing-xl); font-size: 0.9rem; color: var(--text-muted);">
                        Already have an account? <a href="login.html"
                            style="color: var(--primary); text-decoration: none; font-weight: 700;">Login</a>
                    </p>
                </main>
            </div>
        </div>

        <script type="module">
            import { registerWithEmail } from './auth.js';

            const signupBtn = document.getElementById('signup-btn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('error-msg');

            signupBtn.addEventListener('click', async () => {
                const email = emailInput.value;
                const password = passwordInput.value;

                if (!email || !password) {
                    errorMsg.innerText = "Please fill in all fields.";
                    errorMsg.style.display = 'block';
                    return;
                }

                signupBtn.disabled = true;
                signupBtn.innerText = "Creating Profile...";

                const result = await registerWithEmail(email, password);

                if (result.success) {
                    localStorage.setItem('boxing_guru_logged_in', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerText = result.error;
                    errorMsg.style.display = 'block';
                    signupBtn.disabled = false;
                    signupBtn.innerText = 'CREATE ACCOUNT';
                }
            });
        </script>
    </div>
    </div>
    </div>
</body>

</html>
