<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Active - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 40px;
            max-width: 450px;
            margin: 0 auto;
            position: relative;
        }

        /* Top Header */
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-top: 10px;
        }

        .status-text {
            color: var(--primary);
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .round-text {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Linear Progress */
        .linear-progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .linear-progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Visual Card */
        .visual-card {
            width: 100%;
            height: 220px;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .visual-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 10s ease;
        }

        .visual-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 10%, transparent 60%);
        }

        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: #000;
            font-size: 0.6rem;
            font-weight: 950;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
        }

        .card-content {
            position: absolute;
            bottom: 25px;
            left: 25px;
            right: 25px;
        }

        .drill-title-card {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .drill-sub-card {
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Timer Section */
        .timer-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .progress-ring-svg {
            transform: rotate(-90deg);
            width: 260px;
            height: 260px;
        }

        .progress-ring-circle-bg {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 12;
        }

        .progress-ring-circle {
            fill: transparent;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 754;
            /* 2 * PI * 120 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 10px rgba(var(--primary-rgb), 0.5));
        }

        .timer-center {
            position: absolute;
            text-align: center;
        }

        .time-val {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .reps-val {
            font-size: 3rem;
        }

        .time-label {
            font-size: 0.7rem;
            color: #666;
            font-weight: 800;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Stat Pills */
        .stat-pill {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            font-size: 0.8rem;
            font-weight: 800;
        }

        .stat-pill i {
            font-size: 0.9rem;
        }

        .stat-pill.heart {
            top: 10px;
            left: 0px;
        }

        .stat-pill.heart i {
            color: #ff2d55;
        }

        .stat-pill.cal {
            bottom: 20px;
            right: 0px;
        }

        .stat-pill.cal i {
            color: var(--primary);
        }


        /* Bottom Controls */
        .quote-text {
            text-align: center;
            color: #555;
            font-style: italic;
            font-size: 0.8rem;
            margin-bottom: 30px;
        }

        .controls-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            height: 70px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-pause {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-pause:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-end {
            flex: 1;
            background: #ff2d55;
            border: none;
            color: #fff;
            box-shadow: 0 5px 20px rgba(255, 45, 85, 0.3);
        }

        .btn-end:active {
            transform: scale(0.98);
        }

        .btn-done {
            flex: 1;
            background: var(--primary);
            border: none;
            color: #000;
            box-shadow: 0 5px 20px rgba(var(--primary-rgb), 0.3);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="session-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <div id="voice-dot" style="width:6px; height:6px; border-radius:50%; background:#333;"></div>
                <span id="voice-label" style="font-size:0.55rem; color:#666; font-weight:900; letter-spacing:1px;">VOICE
                    OFF</span>
            </div>
            <span class="round-text">DRILL <span id="current-drill-num">1</span> OF <span
                    id="total-drills">--</span></span>
        </div>

        <div class="linear-progress-track">
            <div class="linear-progress-fill" id="session-progress"></div>
        </div>

        <!-- Visual Card -->
        <div class="visual-card">
            <div class="visual-bg" id="visual-bg" style="background-image: url('assets/boxing-bg.jpg');"></div>
            <div class="visual-overlay"></div>
            <div class="live-badge">LIVE</div>
            <div class="card-content">
                <div class="drill-title-card" id="drill-name">Loading...</div>
                <div class="drill-sub-card" id="drill-instruction">PREPARE YOURSELF</div>
            </div>
        </div>

        <!-- Stats & Timer -->
        <div class="timer-wrapper">


            <div class="timer-ring-container">
                <svg class="progress-ring-svg">
                    <circle class="progress-ring-circle-bg" cx="130" cy="130" r="120"></circle>
                    <circle class="progress-ring-circle" id="time-circle" cx="130" cy="130" r="120"></circle>
                </svg>
                <div class="timer-center">
                    <div class="time-val" id="timer-display">00:00</div>
                    <div class="time-label" id="timer-label">SECONDS LEFT</div>
                </div>
            </div>

            <div class="stat-pill cal">
                <i class="fa-solid fa-fire"></i>
                <span id="cal-val">0 kcal</span>
            </div>
        </div>

        <!-- Quote -->
        <div class="quote-text">"Precision beats power, timing beats speed."</div>

        <!-- Controls -->
        <div class="controls-row">
            <button class="control-btn btn-done" id="start-btn" onclick="startSequence()"
                style="width: 100%; box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.4);">
                <i class="fa-solid fa-play"></i> <span>START SESSION</span>
            </button>

            <button class="control-btn btn-pause" id="pause-btn" onclick="togglePause()" style="display:none;">
                <i class="fa-solid fa-pause"></i> <span>PAUSE</span>
            </button>

            <button class="control-btn btn-end" id="action-btn" onclick="finishSession()" style="display:none;">
                <i class="fa-solid fa-stop"></i> <span>END SESSION</span>
            </button>
        </div>
    </div>

    <script src="workout-data.js"></script>
    <script src="user-profile.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const drillIndex = parseInt(urlParams.get('index')) || 0;
        const source = urlParams.get('source') || 'daily';
        const dayIdx = urlParams.get('day');
        const pIdx = urlParams.get('p');

        let currentDrill = null;
        let timerInterval = null;
        let statInterval = null;
        let timeLeft = 0;
        let totalTime = 0;
        let isPaused = false;
        let isRunning = false;

        // ── Voice Command Engine ─────────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let voiceActive = false;

        function initVoiceRecognition() {
            if (!SpeechRecognition || recognition) return;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const command = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                console.log("Voice Command:", command);

                if (command.includes('start') && document.getElementById('start-btn').style.display !== 'none') {
                    startSequence();
                } else if (command.includes('pause') && !isPaused && isRunning) {
                    togglePause();
                } else if (command.includes('resume') && isPaused) {
                    togglePause();
                } else if (command.includes('stop') || command.includes('end')) {
                    finishSession();
                }
            };

            recognition.onend = () => { if (voiceActive) recognition.start(); };
        }

        function startVoiceListener() {
            if (!recognition) initVoiceRecognition();
            if (recognition) {
                voiceActive = true;
                try { recognition.start(); } catch (e) { }
                document.getElementById('voice-dot').style.background = 'var(--primary)';
                document.getElementById('voice-label').textContent = 'VOICE LIVE';
                document.getElementById('voice-label').style.color = 'var(--primary)';
            }
        }

        // Progress Ring Constants
        const circle = document.getElementById('time-circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function init() {
            let workout = getDailyWorkout();

            // Override if protocol
            if (source === 'protocol') {
                const plan = JSON.parse(localStorage.getItem('active_boxing_plan'));
                if (plan && dayIdx !== null && pIdx !== null) {
                    const pData = plan.days[dayIdx].protocol[pIdx];
                    workout = {
                        title: pData.title,
                        drills: [
                            { name: "Dynamic Shadowboxing", duration: 180, type: 'timer', instruction: "Prepare your neural pathways." },
                            { name: pData.title, duration: 300, type: 'timer', instruction: "Execute the core strategic protocol." },
                            { name: "Technical Application", duration: 240, type: 'timer', instruction: "Refine form under fatigue." },
                            { name: "Post-Protocol Stretch", duration: 120, type: 'timer', instruction: "Restore muscle length." }
                        ]
                    };
                }
            }

            if (!workout || !workout.drills) {
                alert("No workout data found.");
                window.location.href = 'training.html';
                return;
            }

            // Setup Header Info
            document.getElementById('current-drill-num').innerText = drillIndex + 1;
            document.getElementById('total-drills').innerText = workout.drills.length;

            const progressPct = ((drillIndex) / workout.drills.length) * 100;
            document.getElementById('session-progress').style.width = `${progressPct}%`;

            if (drillIndex >= workout.drills.length) {
                finishSession("Session Complete!");
                return;
            }

            currentDrill = workout.drills[drillIndex];

            // Setup Visuals
            document.getElementById('drill-name').innerText = currentDrill.name;
            document.getElementById('drill-instruction').innerText = currentDrill.instruction;

            // Dynamic Image Placeholder
            const visualBg = document.getElementById('visual-bg');
            // Assuming we define generic images or use a service
            visualBg.style.backgroundImage = `url('https://placehold.co/600x400/111111/333333/png?text=${encodeURIComponent(currentDrill.name)}')`;

            // Zoom effect start
            setTimeout(() => { visualBg.style.transform = "scale(1.1)"; }, 100);

            // Setup Timer / Mode
            const actionBtn = document.getElementById('action-btn');

            if (currentDrill.type === 'timer') {
                totalTime = currentDrill.duration || 60;
                timeLeft = totalTime;
                updateTimerDisplay(timeLeft);
                // Start full

                // Do NOT start timer automatically
                // startTimer();

            } else {
                // REP BASED
                document.getElementById('timer-display').innerText = currentDrill.reps.split(' ')[0] || "REPS";
                document.getElementById('timer-display').classList.add('reps-val');
                document.getElementById('timer-display').style.fontSize = "2.5rem";
                document.getElementById('timer-display').innerText = currentDrill.reps;
                document.getElementById('timer-label').innerText = "COMPLETE THE SET";

                circle.style.strokeDashoffset = 0; // Full ring

                // For reps, we probably still want the "Start" flow to get into the mood?
                // Or just show "Complete". Let's stick to "Start" flow for consistency.
            }
        }

        function startSequence() {
            // UI Transition — Show Controls Immediately
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'flex';
            document.getElementById('action-btn').style.display = 'flex';

            AppSounds.play('click');

            // Start 10s Prep Timer
            let prepTime = 10;
            document.getElementById('timer-label').innerText = "GET READY";
            document.getElementById('timer-label').style.color = "var(--primary)";
            updateTimerDisplay(prepTime);

            const prepInterval = setInterval(() => {
                if (isPaused) return; // Allow pausing during prep too!
                prepTime--;
                updateTimerDisplay(prepTime);

                if (prepTime <= 0) {
                    clearInterval(prepInterval);
                    beginSession();
                }
            }, 1000);
        }

        function beginSession() {
            // Show Active Controls
            document.getElementById('pause-btn').style.display = 'flex';
            document.getElementById('action-btn').style.display = 'flex';

            // Restore proper label
            document.getElementById('timer-label').innerText = "SECONDS LEFT";
            document.getElementById('timer-label').style.color = "#666";

            if (currentDrill.type === 'timer') {
                updateTimerDisplay(totalTime); // Reset display to total time
                startTimer();
            } else {
                // For reps, manually complete
                const actionBtn = document.getElementById('action-btn');
                actionBtn.className = "control-btn btn-done";
                actionBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>COMPLETE</span>';
                actionBtn.onclick = completeDrill;

                // Restore Rep Display
                document.getElementById('timer-display').innerText = currentDrill.reps;
                document.getElementById('timer-label').innerText = "COMPLETE THE SET";

                // Pause button doesn't make sense for reps, maybe hide or change to info?
                // We keep it for consistency but disable logic
                document.getElementById('pause-btn').style.opacity = '0.5';
                document.getElementById('pause-btn').onclick = null;

                startSimulatedStats();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startSimulatedStats();

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateTimerDisplay(timeLeft);

                    // Update Ring
                    const pct = (timeLeft / totalTime) * 100;
                    setProgress(pct);

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        completeDrill();
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            AppSounds.play('click');

            const btn = document.getElementById('pause-btn');
            const icon = btn.querySelector('i');
            const span = btn.querySelector('span');

            if (isPaused) {
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.style.borderColor = "#fff";
                icon.className = "fa-solid fa-play";
                span.innerText = "RESUME";
            } else {
                btn.style.background = "transparent";
                btn.style.color = "#fff";
                btn.style.borderColor = "rgba(255, 255, 255, 0.2)";
                icon.className = "fa-solid fa-pause";
                span.innerText = "PAUSE";
            }
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function startSimulatedStats() {
            // Stat 2: Current Calories (Starts at 0)
            let currentCal = 0;

            // Initial Set
            document.getElementById('cal-val').innerText = "0 kcal";

            statInterval = setInterval(() => {
                if (!isPaused) {
                    // Increment real calories steadily - SLOWER PACE (10-15 kcal/min approx)
                    // 0.15 to 0.25 per sec
                    currentCal += (Math.random() * 0.1) + 0.15;

                    document.getElementById('cal-val').innerText = Math.floor(currentCal) + ' kcal';
                }
            }, 1000); // Update every second
        }

        function completeDrill() {
            clearInterval(timerInterval);
            clearInterval(statInterval);

            // 1. Mark complete in standard progress
            const todayKey = 'workout_progress_' + (source === 'protocol' ? `protocol_${dayIdx}_${pIdx}` : new Date().toDateString());
            let progress = JSON.parse(localStorage.getItem(todayKey) || '[]');
            if (!progress.includes(drillIndex)) {
                progress.push(drillIndex);
                localStorage.setItem(todayKey, JSON.stringify(progress));
            }

            // 2. Mark complete in Planner Tracking if it's a planner drill
            if (currentDrill && currentDrill.isPlanner) {
                const dateKey = new Date().toDateString();
                const plannerTrackerKey = 'planner_drills_completed_' + dateKey;
                let plannerProgress = JSON.parse(localStorage.getItem(plannerTrackerKey) || '[]');

                // Avoid duplicates
                if (!plannerProgress.some(d => d.name === currentDrill.name)) {
                    plannerProgress.push({
                        name: currentDrill.name,
                        completed_at: Date.now(),
                        impact: currentDrill.impact || 'Standard'
                    });
                    localStorage.setItem(plannerTrackerKey, JSON.stringify(plannerProgress));
                }
            }

            // Transition
            const nextUrl = `session-timer.html?index=${drillIndex + 1}` +
                (source === 'protocol' ? `&source=protocol&day=${dayIdx}&p=${pIdx}` : '');
            window.location.href = nextUrl;
        }

        function finishSession(msg) {
            if (msg || confirm("Exit session? This will reset the current tactical uplink.")) {
                localStorage.removeItem('tactical_session');
                window.location.href = source === 'protocol' ? 'planner.html' : 'training.html';
            }
        }

        init();
        // Auto-start voice listener for hands-free training
        setTimeout(startVoiceListener, 1000);
    </script>
</body>

</html>
