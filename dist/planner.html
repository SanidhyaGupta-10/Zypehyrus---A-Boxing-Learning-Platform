<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Weekly Roadmap - AI Boxing Protocol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="streak-manager.js"></script>
    <script src="notification-manager.js"></script>
    <script src="sound-effects.js"></script>
    <style>
        :root {
            --neon: #E2FF3B;
            --zinc-950: #0a0b0e;
            --zinc-900: #121418;
            --zinc-800: #1c2025;
            --zinc-700: #2d333a;
            --zinc-500: #71717a;
            --primary-rgb: 226, 255, 59;
        }

        body {
            background-color: var(--zinc-950);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Header */
        .roadmap-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bolt-icon {
            color: var(--neon);
            font-size: 1.5rem;
            filter: drop-shadow(0 0 10px rgba(var(--primary-rgb), 0.5));
        }

        .header-title {
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        .notification-bell {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--zinc-500);
            cursor: pointer;
        }

        /* Roadmap Summary */
        .roadmap-summary {
            padding: 30px 24px 10px 24px;
        }

        .performance-track {
            color: var(--neon);
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .weekly-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .weekly-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
        }

        .date-range {
            color: var(--zinc-500);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Calendar Strip */
        .calendar-strip {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .cal-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.3s;
            width: 50px;
        }

        .cal-day-name {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--zinc-500);
            text-transform: uppercase;
        }

        .cal-date {
            font-size: 1.1rem;
            font-weight: 950;
        }

        .cal-item.active {
            background: var(--neon);
            color: #000;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.5);
            transform: scale(1.1);
        }

        .cal-item.active .cal-day-name {
            color: #000;
        }

        /* Protocol Sections */
        .section-label {
            padding: 0 24px;
            color: var(--zinc-500);
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .protocol-list {
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .protocol-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 35px;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .protocol-card.active {
            border-left: 4px solid var(--neon);
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--zinc-500);
            font-weight: 700;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .card-badge {
            display: inline-block;
            background: rgba(var(--primary-rgb), 0.05);
            border: 1px solid var(--neon);
            color: var(--neon);
            font-size: 0.6rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            width: fit-content;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .play-btn.active {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.5);
        }

        /* Recovery Pillar */
        .recovery-pillar {
            margin: 40px 24px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .recovery-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .recovery-label {
            color: var(--zinc-500);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .recovery-text {
            font-size: 1.1rem;
            font-style: italic;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
        }

        .recovery-icon {
            color: var(--zinc-700);
            font-size: 1.5rem;
        }

        /* Intensity Chart */
        .intensity-section {
            margin: 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 40px;
            padding: 30px;
            position: relative;
        }

        .intensity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .intensity-label {
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .intensity-val {
            font-size: 1.5rem;
            font-weight: 950;
            color: var(--neon);
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 80px;
            gap: 8px;
        }

        .bar {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px 50px 10px 10px;
            min-height: 20px;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .bar.active {
            background: var(--neon);
            box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.4);
        }

        .reset-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--neon);
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #000;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(var(--primary-rgb), 0.4);
            transition: all 0.3s;
        }

        .reset-btn i {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .reset-btn span {
            font-size: 0.5rem;
            font-weight: 950;
            text-transform: uppercase;
        }

        .reset-btn:hover {
            transform: rotate(180deg) scale(1.1);
        }

        /* Footer Nav */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: rgba(10, 11, 14, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--zinc-500);
            transition: all 0.3s;
        }

        .nav-link.active {
            color: var(--neon);
        }

        .nav-link i {
            font-size: 1.2rem;
        }

        .nav-link span {
            font-size: 0.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Loading View */
        .loading-view {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(var(--primary-rgb), 0.1);
            border-top: 4px solid var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.2);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .onboarding-gate {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 40px;
        }
    </style>
