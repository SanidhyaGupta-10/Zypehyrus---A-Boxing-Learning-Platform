<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifestyle - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" crossorigin href="/assets/style-DOhgGDO_.css">
</head>

<body>
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 6px; display: flex; z-index: 100;">
        <div
            style="flex: 0.4; background: var(--primary); height: 100%; border-radius: 0 3px 3px 0; box-shadow: 0 0 15px var(--primary);">
        </div>
        <div style="flex: 0.6; background: rgba(255,255,255,0.05); height: 100%;"></div>
    </div>

    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 8vh 20px 0;">
            <div class="page animate-fade anim-slide-right">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; text-transform: uppercase; font-weight: 800; letter-spacing: 2px; font-size: 0.7rem; color: var(--text-muted);">
                    <div style="cursor: pointer;" onclick="history.back()"><i class="fa-solid fa-chevron-left"
                            style="margin-right: 5px;"></i> BACK</div>
                    <div style="color: var(--primary);">STEP 02 / 05</div>
                </div>

                <header class="header animate-slide-up hover-scale" style="text-align: left; margin-bottom: 30px;">
                    <h1 style="font-size: 3rem; font-weight: 900; line-height: 1; color: var(--text);">SELECT YOUR
                        <br><span class="text-neon" style="font-style: italic;">LIFESTYLE.</span>
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 15px; font-size: 1rem; line-height: 1.4;">We'll
                        tailor
                        your training volume and recovery based on your daily activity.</p>
                </header>

                <main class="animate-slide-up hover-scale" style="animation-delay: 0.1s;">
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div class="lifestyle-card stagger-1" onclick="selectLifestyle(this, 'Desk Warrior')">
                            <div class="animate-float"
                                style="width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem;">
                                <i class="fa-solid fa-laptop"></i>
                            </div>
                            <div>
                                <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">The Desk
                                    Warrior</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Focus:
                                    Posture &
                                    Cardio</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>

                        <div class="lifestyle-card stagger-2" onclick="selectLifestyle(this, 'Manual Laborer')">
                            <div class="animate-float"
                                style="width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem;">
                                <i class="fa-solid fa-screwdriver-wrench"></i>
                            </div>
                            <div>
                                <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">The
                                    Manual
                                    Laborer</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Focus:
                                    Recovery
                                    & Mobility</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>

                        <div class="lifestyle-card selected stagger-3" onclick="selectLifestyle(this, 'Student')">
                            <div class="animate-float"
                                style="width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem;">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">The
                                    Student
                                </div>
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Focus:
                                    Mindset &
                                    Burnouts</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>

                        <div class="lifestyle-card stagger-4" onclick="selectLifestyle(this, 'Athlete')">
                            <div class="animate-float"
                                style="width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.2rem;">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <div>
                                <div style="font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Full-Time
                                    Athlete</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Focus: Elite
                                    Performance</div>
                            </div>
                            <div class="radio-circle"></div>
                        </div>
                    </div>

                    <div style="margin-top: 40px;">
                        <button class="btn-primary ripple" id="next-btn"
                            style="width: 100%; height: 75px; border-radius: 100px; font-size: 1.2rem;">
                            CONTINUE TRAINING <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                        </button>
                    </div>
                </main>
            </div>
        </div>

        <script>
            let selectedLifestyle = 'Student';

            function selectLifestyle(el, val) {
                document.querySelectorAll('.lifestyle-card').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');
                selectedLifestyle = val;
            }

            document.getElementById('next-btn').onclick = function (e) {
                createRipple(e);
                setTimeout(() => {
                    const data = JSON.parse(localStorage.getItem('boxing_onboarding_data') || '{}');
                    data.lifestyle = selectedLifestyle;
                    localStorage.setItem('boxing_onboarding_data', JSON.stringify(data));
                    window.location.href = 'persona.html';
                }, 400);
            };

            function createRipple(event) {
                const button = event.currentTarget;
                const circle = document.createElement("span");
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - button.offsetLeft - radius}px`;
                circle.style.top = `${event.clientY - button.offsetTop - radius}px`;
                circle.classList.add("ripple-surface");

                const ripple = button.getElementsByClassName("ripple-surface")[0];
                if (ripple) { ripple.remove(); }
                button.appendChild(circle);
            }
        </script>
    </div>
    </div>
</body>

</html>
