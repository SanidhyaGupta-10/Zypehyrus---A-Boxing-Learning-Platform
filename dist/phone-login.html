<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Login - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" crossorigin href="/assets/style-DOhgGDO_.css">
</head>

<body>
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 20px;">
            <div class="page animate-fade anim-slide-right"
                style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
                <div style="position: absolute; top: 40px; left: 20px;">
                    <button class="glass"
                        style="width: 45px; height: 45px; border-radius: 50%; color: var(--text); border: 1px solid rgba(255,255,255,0.1); cursor: pointer;"
                        onclick="history.back()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>

                <main class="animate-slide-up hover-scale" style="width: 100%; max-width: 400px;">
                    <div style="margin-bottom: var(--spacing-xl);">
                        <div class="animate-float"
                            style="width: 80px; height: 80px; background: transparent; border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.3);">
                            <i class="fa-solid fa-person-walking-arrow-right"
                                style="color: var(--primary); font-size: 2rem;"></i>
                        </div>
                        <h1 class="italic-title" style="font-size: 2.8rem; margin-bottom: 10px;">READY TO <br><span
                                class="text-primary-italic">FIGHT?</span></h1>
                        <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.4; padding: 0 20px;">
                            Enter
                            your mobile number to step into the ring and start your training.</p>
                    </div>

                    <div class="glass-card"
                        style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 10px 30px; display: flex; align-items: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.05);">
                        <span
                            style="color: var(--primary); font-weight: 800; font-size: 1.2rem; margin-right: 15px;">+1</span>
                        <input type="tel" id="phone" placeholder="(555) 000-0000"
                            style="background: transparent; border: none; color: var(--text); font-size: 1.2rem; font-weight: 500; width: 100%; outline: none; letter-spacing: 1px;">
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: var(--spacing-xl);">We'll
                        send you
                        a verification code via SMS.</p>

                    <button id="next-btn" class="btn-primary ripple"
                        style="width: 100%; height: 70px; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;">
                        ENTER RING <i class="fa-solid fa-bolt animate-float"></i>
                    </button>

                    <div style="margin-top: 40px;">
                        <p
                            style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem; color: var(--text-muted); font-weight: 700; opacity: 0.6; margin-bottom: 15px;">
                            The hardest part is showing up.</p>
                        <div style="display: flex; justify-content: center; gap: 20px;">
                            <a href="#"
                                style="color: var(--text-muted); font-size: 0.7rem; text-decoration: underline;">Terms
                                of
                                Service</a>
                            <a href="#"
                                style="color: var(--text-muted); font-size: 0.7rem; text-decoration: underline;">Privacy
                                Policy</a>
                        </div>
                    </div>
                </main>

                <script>
                    document.getElementById('next-btn').onclick = function (e) {
                        createRipple(e);
                        const phone = document.getElementById('phone').value;
                        if (!phone) {
                            alert('Enter your digits, fighter.');
                            return;
                        }
                        localStorage.setItem('boxing_guru_logged_in', 'true');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 400);
                    };

                    function createRipple(event) {
                        const button = event.currentTarget;
                        const circle = document.createElement("span");
                        const diameter = Math.max(button.clientWidth, button.clientHeight);
                        const radius = diameter / 2;

                        circle.style.width = circle.style.height = `${diameter}px`;
                        circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
                        circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
                        circle.classList.add("ripple-surface");

                        const ripple = button.getElementsByClassName("ripple-surface")[0];
                        if (ripple) { ripple.remove(); }
                        button.appendChild(circle);
                    }
                </script>
            </div>
        </div>
    </div>
</body>

</html>
