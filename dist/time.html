<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Time - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/time-CzBVLgkY.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Dx3LiayG.css">
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header animate-slide-up hover-scale" style="text-align: left; margin-bottom: 20px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 12px; text-transform: uppercase;">
                        ONBOARDING 05/10</div>
                    <h1 style="font-size: 2.8rem; font-weight: 700; line-height: 1.1; color: var(--text);">Daily
                        <br><span class="text-neon" style="font-style: italic;">Time Slot</span>
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 15px; font-size: 0.95rem; line-height: 1.4;">This
                        dictates the density and volume of your sessions.</p>
                </header>

                <main class="animate-slide-up hover-scale"
                    style="animation-delay: 0.1s; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px;">
                    <div class="time-list" style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="glass-card time-card" onclick="selectTime(this, 20)"
                            style="padding: 20px !important;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <h2
                                        style="font-style: italic; font-weight: 900; font-size: 1.5rem; line-height: 1;">
                                        < 30 MINS</h2>
                                            <p style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">
                                                Rapid Fire. 2 exercises daily.</p>
                                </div>
                                <i class="fa-solid fa-bolt-lightning time-icon"></i>
                            </div>
                        </div>

                        <div class="glass-card time-card" onclick="selectTime(this, 45)"
                            style="padding: 20px !important;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <h2
                                        style="font-style: italic; font-weight: 900; font-size: 1.5rem; line-height: 1;">
                                        30-60 MINS</h2>
                                    <p style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">Core block.
                                        3-5 exercises.</p>
                                </div>
                                <i class="fa-solid fa-weight-hanging time-icon"></i>
                            </div>
                        </div>

                        <div class="glass-card time-card" onclick="selectTime(this, 90)"
                            style="padding: 20px !important;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <h2
                                        style="font-style: italic; font-weight: 900; font-size: 1.5rem; line-height: 1;">
                                        60+ MINS</h2>
                                    <p style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">Deep
                                        immersion. Full volume.</p>
                                </div>
                                <i class="fa-solid fa-crown time-icon"></i>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 25px; text-align: center;">
                        <button class="btn-primary hover-scale" id="next-btn"
                            style="width: 100%; height: 75px; font-size: 1.2rem; border-radius: 100px;">
                            LOCK IN TIME <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                        </button>
                        <a href="experience.html"
                            style="display: block; text-decoration: none; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 15px;">BACK</a>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <style>
        .time-card {
            border: 2px solid transparent !important;
            transition: 0.3s;
            cursor: pointer;
        }

        .time-icon {
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .time-card.selected {
            border-color: var(--primary) !important;
            background: rgba(var(--primary-rgb), 0.05) !important;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.2);
            transform: scale(1.02);
        }

        .time-card.selected h2,
        .time-card.selected .time-icon {
            color: var(--primary) !important;
        }
    </style>

</body>

</html>
