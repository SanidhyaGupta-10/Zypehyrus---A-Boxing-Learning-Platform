<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stance - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/stance-DSziBPdk.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Dx3LiayG.css">
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header animate-slide-up hover-scale" style="text-align: left; margin-bottom: 20px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 12px; text-transform: uppercase;">
                        ONBOARDING 07/10</div>
                    <h1 style="font-size: 2.8rem; font-weight: 700; line-height: 1.1; color: var(--text);">Select Your
                        <br><span class="text-neon" style="font-style: italic;">Fighting Stance</span>
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 15px; font-size: 0.95rem; line-height: 1.4;">This
                        calibrates your drills and movement patterns.</p>
                </header>

                <main class="animate-slide-up hover-scale"
                    style="animation-delay: 0.1s; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
                    <div class="stance-container" style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="glass-card stance-card selected" onclick="selectStance(this, 'Orthodox')">
                            <h2
                                style="font-style: italic; font-weight: 900; font-size: 2rem; color: var(--text); text-transform: uppercase; line-height: 1;">
                                ORTHODOX</h2>
                            <p
                                style="font-size: 0.8rem; color: var(--primary); font-weight: 700; margin-top: 5px; text-transform: uppercase;">
                                LEFT LEAD • RIGHT HANDED</p>
                        </div>

                        <div class="glass-card stance-card" onclick="selectStance(this, 'Southpaw')">
                            <h2
                                style="font-style: italic; font-weight: 900; font-size: 2rem; color: var(--text); text-transform: uppercase; line-height: 1; opacity: 0.3;">
                                SOUTHPAW</h2>
                            <p
                                style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-top: 5px; text-transform: uppercase;">
                                RIGHT LEAD • LEFT HANDED</p>
                        </div>
                    </div>

                    <div style="margin-top: 25px; text-align: center;">
                        <button id="next-btn" class="btn-primary hover-scale"
                            style="width: 100%; height: 75px; border-radius: 100px; font-size: 1.2rem;">
                            CONFIRM STANCE <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                        </button>
                        <a href="constraints.html"
                            style="display: block; text-decoration: none; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 15px;">BACK</a>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <style>
        .stance-card {
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent !important;
            padding: 30px !important;
            text-align: center;
        }

        .stance-card.selected {
            border-color: var(--primary) !important;
            background: rgba(var(--primary-rgb), 0.05) !important;
            box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.2);
            transform: scale(1.02);
        }

        .stance-card.selected h2 {
            opacity: 1 !important;
        }
    </style>

</body>

</html>
