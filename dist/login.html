<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/login-W3U-55oF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-DN_CxKx0.js">
  <link rel="stylesheet" crossorigin href="/assets/style-DOhgGDO_.css">
</head>

<body>
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 20px;">
            <div class="page animate-fade anim-slide-right"
                style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh;">
                <header class="header animate-slide-up hover-scale">
                    <div style="font-size: 3rem; margin-bottom: var(--spacing-md); color: var(--primary);">
                        <i class="fa-solid fa-user-lock"></i>
                    </div>
                    <h1 class="text-gradient">Secure Your Progress</h1>
                    <p>Login or create an account to save your DNA profile and start training.</p>
                </header>

                <main class="animate-slide-up hover-scale" style="animation-delay: 0.1s;">
                    <div class="glass-card">
                        <div class="input-group">
                            <label class="input-label" for="email">Email Address</label>
                            <input type="email" id="email" class="input-field" placeholder="champion@boxing.com">
                        </div>

                        <div class="input-group">
                            <label class="input-label" for="password">Password</label>
                            <input type="password" id="password" class="input-field" placeholder="••••••••">
                        </div>

                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl); font-size: 0.8rem;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                            </label>
                            <a href="#" style="color: var(--primary); text-decoration: none;">Forgot Password?</a>
                        </div>

                        <button class="btn btn-primary" id="login-btn" style="width: 100%; height: 55px;">
                            LOGIN <i class="fa-solid fa-right-to-bracket"></i>
                        </button>

                        <div id="error-msg"
                            style="color: #ff4747; font-size: 0.8rem; text-align: center; margin-top: 10px; display: none;">
                        </div>

                        <div
                            style="text-align: center; margin: var(--spacing-lg) 0; color: var(--text-muted); font-size: 0.9rem;">
                            OR
                        </div>

                        <div style="display: flex; gap: var(--spacing-md);">
                            <button class="btn btn-outline" style="flex: 1; padding: 12px 0;">
                                <i class="fa-brands fa-google"></i> Google
                            </button>
                            <button class="btn btn-outline" style="flex: 1; padding: 12px 0;">
                                <i class="fa-brands fa-apple"></i> Apple
                            </button>
                        </div>
                    </div>

                    <p
                        style="text-align: center; margin-top: var(--spacing-xl); font-size: 0.9rem; color: var(--text-muted);">
                        Don't have an account? <a href="signup.html"
                            style="color: var(--primary); text-decoration: none; font-weight: 700;">Sign Up</a>
                    </p>
                </main>
            </div>
        </div>

    </div>
    </div>
    </div>
</body>

</html>
