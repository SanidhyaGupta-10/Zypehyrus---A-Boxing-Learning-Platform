<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Promise - AI Boxing Guru</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/assets/promise-WSWCnKMC.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/style-Dx3LiayG.css">
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header animate-slide-up hover-scale" style="text-align: left; margin-bottom: 20px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 12px; text-transform: uppercase;">
                        FINAL STEP</div>
                    <h1 style="font-size: 2.8rem; font-weight: 700; line-height: 1.1; color: var(--text);">The Fighter's
                        <br><span class="text-neon" style="font-style: italic;">Promise</span>
                    </h1>
                </header>

                <main class="animate-slide-up hover-scale"
                    style="animation-delay: 0.1s; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
                    <div class="glass-card"
                        style="padding: 30px !important; border: 1px solid rgba(226, 255, 59, 0.4) !important; background: rgba(0,0,0,0.6) !important; position: relative;">
                        <div
                            style="position: absolute; top: -10px; left: 20px; background: var(--primary); color: #000; font-weight: 950; font-size: 0.6rem; padding: 2px 10px; border-radius: 4px;">
                            SACRED OATH</div>
                        <p
                            style="font-size: 1.2rem; line-height: 1.6; color: var(--text); font-style: italic; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">
                            "I UNDERSTAND THAT THIS IS NOT A GAME. THE AI BOXING PROTOCOL IS A HIGH-STREAK PERFORMANCE
                            ENGINE. I PROMISE TO SHOW UP, LOG MY SWEAT, AND NEVER BREAK MY STREAK."
                        </p>
                    </div>

                    <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                        <input type="checkbox" id="promise-check"
                            style="width: 28px; height: 28px; accent-color: var(--primary); cursor: pointer;">
                        <label for="promise-check"
                            style="font-size: 0.85rem; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; cursor: pointer;">I
                            ACCEPT THE TERMS</label>
                    </div>
                </main>

                <footer style="margin-top: 25px; text-align: center;">
                    <button id="finish-btn" class="btn-primary hover-scale"
                        style="width: 100%; height: 75px; border-radius: 100px; font-size: 1.2rem; background: var(--primary); color: #000; font-weight: 950;">
                        INITIALIZE SYSTEM <i class="fa-solid fa-power-off" style="margin-left: 10px;"></i>
                    </button>
                    <a href="frequency.html"
                        style="display: block; text-decoration: none; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 15px;">BACK</a>
                </footer>
            </div>
        </div>
    </div>

</body>

</html>
