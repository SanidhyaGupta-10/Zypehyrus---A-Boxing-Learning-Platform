<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Active - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at center, #141414 0%, #050505 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* Tactical HUD Grid scanlines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 18, 18, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(226, 255, 59, 0.02), rgba(0, 0, 0, 0), rgba(255, 45, 85, 0.02));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.35;
        }

        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 40px;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        /* Top Header */
        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-top: 10px;
        }

        .status-text {
            color: var(--primary);
            font-weight: 900;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.4);
        }

        .round-text {
            color: #fff;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Linear Progress */
        .linear-progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .linear-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, #fff 100%);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Visual Card */
        .visual-card {
            width: 100%;
            height: 160px;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(var(--primary-rgb), 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(8px);
        }

        .visual-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 10s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .visual-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 20%, transparent 80%);
        }

        .live-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            color: #000;
            font-size: 0.55rem;
            font-weight: 950;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.5);
        }

        .card-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .drill-title-card {
            font-size: 1.25rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .drill-sub-card {
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Timer Section */
        .timer-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .progress-ring-svg {
            transform: rotate(-90deg);
            width: 260px;
            height: 260px;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .progress-ring-circle-bg {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.02);
            stroke-width: 12;
        }

        .progress-ring-circle {
            fill: transparent;
            stroke: var(--primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 754;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 12px rgba(var(--primary-rgb), 0.75));
        }

        .timer-center {
            position: absolute;
            text-align: center;
        }

        .timer-ring-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #exercise-gif-holder {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 2px dashed rgba(var(--primary-rgb), 0.4);
            background: radial-gradient(circle, rgba(var(--primary-rgb), 0.05) 0%, rgba(0,0,0,0.85) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(var(--primary-rgb), 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #exercise-gif-holder::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            top: 0;
            animation: gif-scan 2.5s linear infinite;
            box-shadow: 0 0 8px var(--primary);
        }

        @keyframes gif-scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .time-val {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.15);
            font-family: monospace;
        }

        .reps-val {
            font-size: 2.8rem;
        }

        .time-label {
            font-size: 0.6rem;
            color: #888;
            font-weight: 900;
            letter-spacing: 2.5px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        /* Stat Pills */
        .stat-pill {
            position: absolute;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            font-size: 0.75rem;
            font-weight: 800;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255,255,255,0.01);
            transition: all 0.3s;
        }

        .stat-pill.heart {
            top: 20px;
            left: 10px;
            border-color: rgba(255, 45, 85, 0.25);
        }

        .stat-pill.heart i {
            color: #ff2d55;
            text-shadow: 0 0 8px #ff2d55;
        }

        .stat-pill.cal {
            bottom: 20px;
            right: 10px;
            border-color: rgba(226, 255, 59, 0.25);
        }

        .stat-pill.cal i {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
        }

        /* Bottom Controls */
        .quote-text {
            text-align: center;
            color: #444;
            font-style: italic;
            font-size: 0.75rem;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-btn {
            height: 56px;
            border-radius: 28px;
            font-weight: 950;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            flex: 1 1 calc(50% - 10px);
            min-width: 0;
        }

        .control-btn:hover {
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(1px);
        }

        .btn-pause {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .btn-pause:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-end {
            flex: 1;
            background: linear-gradient(135deg, #ff2d55 0%, #b3002d 100%);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 45, 85, 0.3);
        }

        .btn-done {
            flex: 1;
            background: linear-gradient(135deg, var(--primary) 0%, #aabf1e 100%);
            color: #000;
            box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
        }

        .btn-back-nav {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-next-nav {
            flex: 1;
            background: rgba(var(--primary-rgb), 0.15);
            border: 1px solid rgba(var(--primary-rgb), 0.4);
            color: var(--primary);
        }

        .controls-row.protocol-controls {
            flex-wrap: wrap;
        }

        .controls-row.protocol-controls .control-btn {
            flex: 1;
            min-width: calc(33% - 14px);
            height: 56px;
            font-size: 0.7rem;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="session-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <div id="voice-dot" style="width:6px; height:6px; border-radius:50%; background:#333;"></div>
                <span id="voice-label" style="font-size:0.55rem; color:#666; font-weight:900; letter-spacing:1px;">VOICE
                    OFF</span>
            </div>
            <span class="round-text">DRILL <span id="current-drill-num">1</span> OF <span
                    id="total-drills">--</span></span>
        </div>

        <div class="linear-progress-track">
            <div class="linear-progress-fill" id="session-progress"></div>
        </div>

        <!-- Visual Card -->
        <div class="visual-card">
            <div class="visual-bg" id="visual-bg" style="background-image: url('assets/boxing-bg.jpg');"></div>
            <div class="visual-overlay"></div>
            <div class="live-badge">LIVE</div>
            <div class="card-content">
                <div class="drill-title-card" id="drill-name">Loading...</div>
                <div class="drill-sub-card" id="drill-instruction">PREPARE YOURSELF</div>
            </div>
        </div>

        <!-- Active Exercise Header -->
        <h2 id="hud-exercise-name" style="color: var(--primary); text-align: center; font-weight: 950; font-size: 1.6rem; text-transform: uppercase; margin: 15px 0; font-style: italic; letter-spacing: 1px; text-shadow: 0 0 15px rgba(var(--primary-rgb), 0.3);">Loading...</h2>

        <!-- Stats & Timer -->
        <div class="timer-wrapper">
            <div class="stat-pill heart">
                <i class="fa-solid fa-heart-pulse animate-pulse" style="animation: pulse 1s infinite;"></i>
                <span id="heart-bpm">98 bpm</span>
            </div>

            <div class="timer-ring-container">
                <svg class="progress-ring-svg">
                    <circle class="progress-ring-circle-bg" cx="130" cy="130" r="120"></circle>
                    <circle class="progress-ring-circle" id="time-circle" cx="130" cy="130" r="120"></circle>
                </svg>
                <div class="timer-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <!-- Circular GIF Holder -->
                    <div id="exercise-gif-holder" style="width: 100px; height: 100px; border-radius: 50%; border: 2px dashed rgba(var(--primary-rgb), 0.3); background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 5px; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.9);">
                        <i class="fa-solid fa-play" style="font-size: 1.5rem; color: rgba(var(--primary-rgb), 0.2); animation: pulse 2s infinite;"></i>
                        <span style="font-size: 0.45rem; color: rgba(255,255,255,0.3); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; position: absolute; bottom: 8px;">GIF HOLDER</span>
                    </div>
                    <div class="time-val" id="timer-display">00:00</div>
                    <div class="time-label" id="timer-label">SECONDS LEFT</div>
                </div>
            </div>

            <div class="stat-pill cal">
                <i class="fa-solid fa-fire"></i>
                <span id="cal-val">0 kcal</span>
            </div>
        </div>

        <!-- Quote -->
        <div class="quote-text">"Precision beats power, timing beats speed."</div>

        <!-- Controls -->
        <div class="controls-row" id="main-controls">
            <button class="control-btn btn-done" id="start-btn" onclick="startSequence()"
                style="flex: 1 1 100%; box-shadow: 0 0 30px rgba(var(--primary-rgb), 0.4);">
                <i class="fa-solid fa-play"></i> <span>START SET</span>
            </button>

            <button class="control-btn btn-pause" id="pause-btn" onclick="togglePause()" style="display:none; flex: 1 1 calc(50% - 5px);">
                <i class="fa-solid fa-pause"></i> <span>PAUSE</span>
            </button>

            <button class="control-btn" id="terminate-btn" onclick="finishSession(true)" style="display:none; flex: 1 1 calc(50% - 5px); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); color: #aaa;">
                <i class="fa-solid fa-square-xmark"></i> <span>TERMINATE</span>
            </button>

            <button class="control-btn btn-done" id="action-btn" onclick="onMainActionClick()" style="display:none; flex: 1 1 100%;">
                <i class="fa-solid fa-check"></i> <span>FINISH SET</span>
            </button>
        </div>

        <div class="controls-row protocol-controls" id="protocol-nav" style="display: none;">
            <button type="button" class="control-btn btn-back-nav" onclick="goBackDrill()">
                <i class="fa-solid fa-arrow-left"></i> <span>BACK</span>
            </button>
            <button type="button" class="control-btn btn-end" onclick="endProtocolBlock()">
                <i class="fa-solid fa-stop"></i> <span>END</span>
            </button>
            <button type="button" class="control-btn btn-next-nav" onclick="skipToNextDrill()">
                <span>NEXT</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script src="sound-effects.js"></script>
    <script src="workout-data.js"></script>
    <script src="user-profile.js"></script>
    <script src="protocol-session-utils.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const drillIndex = parseInt(urlParams.get('index')) || 0;
        const source = urlParams.get('source') || 'daily';
        const dayIdx = urlParams.get('day');
        const pIdx = urlParams.get('p');
        const autostart = urlParams.get('autostart') === '1';
        const isProtocol = source === 'protocol' && dayIdx !== null && pIdx !== null;

        let workoutSession = null;
        let currentDrill = null;
        let timerInterval = null;
        let statInterval = null;
        let timeLeft = 0;
        let totalTime = 0;
        let isPaused = false;
        let isRunning = false;

        // ── Voice Command Engine ─────────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let voiceActive = false;

        function initVoiceRecognition() {
            if (!SpeechRecognition || recognition) return;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const command = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                console.log("Voice Command:", command);

                if (command.includes('start') && document.getElementById('start-btn').style.display !== 'none') {
                    startSequence();
                } else if (command.includes('pause') && !isPaused && isRunning) {
                    togglePause();
                } else if (command.includes('resume') && isPaused) {
                    togglePause();
                } else if (command.includes('stop') || command.includes('end')) {
                    finishSession();
                }
            };

            recognition.onend = () => { if (voiceActive) recognition.start(); };
        }

        function startVoiceListener() {
            if (!recognition) initVoiceRecognition();
            if (recognition) {
                voiceActive = true;
                try { recognition.start(); } catch (e) { }
                document.getElementById('voice-dot').style.background = 'var(--primary)';
                document.getElementById('voice-label').textContent = 'VOICE LIVE';
                document.getElementById('voice-label').style.color = 'var(--primary)';
            }
        }

        // Progress Ring Constants
        const circle = document.getElementById('time-circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function getWorkout() {
            if (isProtocol && window.ProtocolSession) {
                const drills = window.ProtocolSession.loadCachedDrills(dayIdx, pIdx);
                const plan = JSON.parse(localStorage.getItem('active_boxing_plan_v2') || 'null');
                const title = plan?.days?.[dayIdx]?.protocol?.[pIdx]?.title || 'Protocol Block';
                return { title, drills };
            }
            return getDailyWorkout();
        }

        function showProtocolNav() {
            if (!isProtocol) return;
            document.getElementById('protocol-nav').style.display = 'flex';
        }

        function onMainActionClick() {
            if (isRunning || document.getElementById('pause-btn').style.display !== 'none') {
                completeDrill();
            } else {
                startSequence();
            }
        }

        function goBackDrill() {
            clearInterval(timerInterval);
            clearInterval(statInterval);
            if (drillIndex > 0) {
                window.location.href =
                    `session-timer.html?index=${drillIndex - 1}&source=protocol&day=${dayIdx}&p=${pIdx}`;
            } else {
                window.location.href = `protocol-session.html?day=${dayIdx}&p=${pIdx}`;
            }
        }

        function endProtocolBlock() {
            if (confirm('End this protocol block? Completed sets are saved.')) {
                clearInterval(timerInterval);
                clearInterval(statInterval);
                window.location.href = `protocol-session.html?day=${dayIdx}&p=${pIdx}`;
            }
        }

        function skipToNextDrill() {
            completeDrill();
        }

        function init() {
            workoutSession = getWorkout();

            if (!workoutSession || !workoutSession.drills || !workoutSession.drills.length) {
                alert('No workout data found.');
                window.location.href = isProtocol ? 'planner.html' : 'training.html';
                return;
            }

            if (isProtocol) {
                showProtocolNav();
                document.querySelector('#start-btn span').textContent = 'START SET';
            }

            // Setup Header Info
            document.getElementById('current-drill-num').innerText = drillIndex + 1;
            document.getElementById('total-drills').innerText = workoutSession.drills.length;

            const progressPct = (drillIndex / workoutSession.drills.length) * 100;
            document.getElementById('session-progress').style.width = `${progressPct}%`;

            if (drillIndex >= workoutSession.drills.length) {
                if (isProtocol) {
                    window.ProtocolSession.markProtocolFullyComplete(dayIdx, pIdx);
                    window.location.href =
                        `protocol-session.html?day=${dayIdx}&p=${pIdx}&finished=1`;
                } else {
                    finishSession('Session Complete!');
                }
                return;
            }

            currentDrill = workoutSession.drills[drillIndex];

            // Setup Visuals
            document.getElementById('drill-name').innerText = currentDrill.name;
            document.getElementById('hud-exercise-name').innerText = currentDrill.name;
            document.getElementById('drill-instruction').innerText = currentDrill.instruction;

            // Dynamic Image Placeholder
            const visualBg = document.getElementById('visual-bg');
            // Assuming we define generic images or use a service
            visualBg.style.backgroundImage = `url('https://placehold.co/600x400/111111/333333/png?text=${encodeURIComponent(currentDrill.name)}')`;

            // Zoom effect start
            setTimeout(() => { visualBg.style.transform = "scale(1.1)"; }, 100);

            // Setup Timer / Mode
            const actionBtn = document.getElementById('action-btn');

            if (currentDrill.type === 'timer') {
                totalTime = currentDrill.duration || 60;
                timeLeft = totalTime;
                updateTimerDisplay(timeLeft);
                // Start full

            } else {
                // REP BASED
                document.getElementById('timer-display').innerText = currentDrill.reps.split(' ')[0] || "REPS";
                document.getElementById('timer-display').classList.add('reps-val');
                document.getElementById('timer-display').style.fontSize = "2.5rem";
                document.getElementById('timer-display').innerText = currentDrill.reps;
                document.getElementById('timer-label').innerText = "COMPLETE THE SET";

                circle.style.strokeDashoffset = 0; // Full ring

                // For reps, we probably still want the "Start" flow to get into the mood?
            }

            if (autostart) {
                setTimeout(() => startSequence(), 400);
            }
        }

        function startSequence() {
            // UI Transition — Show Controls Immediately
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'flex';
            document.getElementById('action-btn').style.display = 'flex';
            document.getElementById('terminate-btn').style.display = 'flex';

            AppSounds.play('click');

            // Start 15s Prep Timer
            let prepTime = 15;
            document.getElementById('timer-label').innerText = "GET READY";
            document.getElementById('timer-label').style.color = "var(--primary)";
            document.getElementById('timer-display').classList.remove('reps-val');
            document.getElementById('timer-display').style.fontSize = '';
            updateTimerDisplay(prepTime);
            setProgress(100);

            const prepInterval = setInterval(() => {
                if (isPaused) return; // Allow pausing during prep too!
                prepTime--;
                updateTimerDisplay(prepTime);

                if (prepTime <= 0) {
                    clearInterval(prepInterval);
                    beginSession();
                }
            }, 1000);
        }

        function beginSession() {
            document.getElementById('pause-btn').style.display = 'flex';
            const actionBtn = document.getElementById('action-btn');
            actionBtn.style.display = 'flex';
            actionBtn.className = 'control-btn btn-done';
            actionBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>FINISH SET</span>';

            document.getElementById('timer-label').innerText = 'SECONDS LEFT';
            document.getElementById('timer-label').style.color = '#666';

            if (currentDrill.type === 'timer') {
                updateTimerDisplay(totalTime);
                startTimer();
            } else {
                // For reps, manually complete
                const actionBtn = document.getElementById('action-btn');
                actionBtn.className = "control-btn btn-done";
                actionBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>COMPLETE</span>';
                actionBtn.onclick = completeDrill;

                // Restore Rep Display
                document.getElementById('timer-display').innerText = currentDrill.reps;
                document.getElementById('timer-label').innerText = "COMPLETE THE SET";

                // Keep pause button fully interactive!
                document.getElementById('pause-btn').style.opacity = '1';
                document.getElementById('pause-btn').onclick = togglePause;

                startSimulatedStats();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startSimulatedStats();

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    updateTimerDisplay(timeLeft);

                    // Update Ring
                    const pct = (timeLeft / totalTime) * 100;
                    setProgress(pct);

                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        completeDrill();
                    }
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            AppSounds.play('click');

            const btn = document.getElementById('pause-btn');
            const icon = btn.querySelector('i');
            const span = btn.querySelector('span');

            if (isPaused) {
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.style.borderColor = "#fff";
                icon.className = "fa-solid fa-play";
                span.innerText = "RESUME";
            } else {
                btn.style.background = "transparent";
                btn.style.color = "#fff";
                btn.style.borderColor = "rgba(255, 255, 255, 0.2)";
                icon.className = "fa-solid fa-pause";
                span.innerText = "PAUSE";
            }
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function startSimulatedStats() {
            // Stat 2: Current Calories (Starts at 0)
            let currentCal = 0;

            // Initial Set
            document.getElementById('cal-val').innerText = "0 kcal";

            statInterval = setInterval(() => {
                if (!isPaused) {
                    // Increment real calories steadily - SLOWER PACE (10-15 kcal/min approx)
                    // 0.15 to 0.25 per sec
                    currentCal += (Math.random() * 0.1) + 0.15;

                    document.getElementById('cal-val').innerText = Math.floor(currentCal) + ' kcal';
                }
            }, 1000); // Update every second
        }

        function completeDrill() {
            clearInterval(timerInterval);
            clearInterval(statInterval);
            isRunning = false;

            if (isProtocol && window.ProtocolSession) {
                window.ProtocolSession.markDrillComplete(dayIdx, pIdx, drillIndex);
                const total = workoutSession.drills.length;

                if (drillIndex + 1 >= total) {
                    window.ProtocolSession.markProtocolFullyComplete(dayIdx, pIdx);
                    window.location.href =
                        `protocol-session.html?day=${dayIdx}&p=${pIdx}&finished=1`;
                    return;
                }

                const rest = currentDrill.restAfter || 0;
                const nextUrl =
                    `session-timer.html?index=${drillIndex + 1}&source=protocol&day=${dayIdx}&p=${pIdx}&autostart=1`;

                if (rest > 0) {
                    runRestCountdown(rest, nextUrl);
                    return;
                }
                window.location.href = nextUrl;
                return;
            }

            const todayKey = 'workout_progress_' + new Date().toDateString();
            let progress = JSON.parse(localStorage.getItem(todayKey) || '[]');
            if (!progress.includes(drillIndex)) {
                progress.push(drillIndex);
                localStorage.setItem(todayKey, JSON.stringify(progress));
            }

            if (currentDrill && currentDrill.isPlanner) {
                const dateKey = new Date().toDateString();
                const plannerTrackerKey = 'planner_drills_completed_' + dateKey;
                let plannerProgress = JSON.parse(localStorage.getItem(plannerTrackerKey) || '[]');
                if (!plannerProgress.some((d) => d.name === currentDrill.name)) {
                    plannerProgress.push({
                        name: currentDrill.name,
                        completed_at: Date.now(),
                        impact: currentDrill.impact || 'Standard',
                    });
                    localStorage.setItem(plannerTrackerKey, JSON.stringify(plannerProgress));
                }
            }

            const nextUrl = `session-timer.html?index=${drillIndex + 1}&autostart=1`;
            if (drillIndex + 1 >= workoutSession.drills.length) {
                finishSession('Session Complete!');
                return;
            }
            runRestCountdown(15, nextUrl);
        }

        function runRestCountdown(seconds, nextUrl) {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('timer-label').innerText = 'REST — NEXT DRILL';
            document.getElementById('timer-label').style.color = 'var(--primary)';
            let left = seconds;
            updateTimerDisplay(left);
            setProgress(100);

            const restInterval = setInterval(() => {
                if (isPaused) return;
                left--;
                updateTimerDisplay(left);
                if (left <= 0) {
                    clearInterval(restInterval);
                    window.location.href = nextUrl;
                }
            }, 1000);
        }

        function finishSession(msg) {
            if (msg || confirm('Exit session?')) {
                localStorage.removeItem('tactical_session');
                if (isProtocol) {
                    window.location.href = `protocol-session.html?day=${dayIdx}&p=${pIdx}`;
                } else {
                    window.location.href = 'training.html';
                }
            }
        }

        init();

        // Live Heart Rate Telemetry Simulation
        setInterval(() => {
            if (isRunning && !isPaused) {
                const bpm = Math.floor(Math.random() * (145 - 130 + 1)) + 130;
                const heartBpm = document.getElementById('heart-bpm');
                if (heartBpm) heartBpm.innerText = bpm + " bpm";
            } else if (!isPaused) {
                const bpm = Math.floor(Math.random() * (95 - 80 + 1)) + 80;
                const heartBpm = document.getElementById('heart-bpm');
                if (heartBpm) heartBpm.innerText = bpm + " bpm";
            }
        }, 2000);

        // Auto-start voice listener for hands-free training
        setTimeout(startVoiceListener, 1000);
    </script>
</body>
