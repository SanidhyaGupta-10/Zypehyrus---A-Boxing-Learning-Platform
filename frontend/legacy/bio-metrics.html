<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile - AI Boxing Protocol</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="audio-engine.js"></script>
    <script src="sound-effects.js"></script>
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header" style="text-align: left; margin-bottom: 20px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 15px; text-transform: uppercase;">
                        ONBOARDING 02/10</div>
                    <h1 style="font-size: 2.8rem; font-weight: 700; line-height: 1; color: var(--text);">Fighter
                        <br><span class="text-neon" style="font-style: italic;">Bio-Metrics</span>
                    </h1>
                    <p
                        style="color: var(--text-muted); margin-top: 20px; font-size: 0.95rem; line-height: 1.5; padding-right: 20px;">
                        This data feeds the engine to calculate training intensity and impact safety.</p>
                </header>

                <main
                    style="animation-delay: 0.1s; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="input-group" style="margin-bottom: 30px;">
                        <label
                            style="display: block; color: var(--primary); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">RING
                            NAME</label>
                        <input type="text" id="ring_name" class="underline-input" placeholder="e.g. TITAN"
                            autocomplete="off" style="font-size: 1.8rem;">
                    </div>

                    <div class="input-group" style="margin-bottom: 30px;">
                        <label
                            style="display: block; color: var(--primary); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">PHONE
                            NUMBER</label>
                        <input type="tel" id="phone_number" class="underline-input" placeholder="+1..."
                            autocomplete="off" style="font-size: 1.8rem;">
                    </div>

                    <div class="input-group" style="margin-bottom: 30px;">
                        <label
                            style="display: block; color: var(--primary); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">AGE</label>
                        <input type="number" id="age" class="underline-input" placeholder="YEARS" autocomplete="off"
                            style="font-size: 1.8rem;">
                    </div>

                    <div class="input-group" style="margin-bottom: 30px;">
                        <label
                            style="display: block; color: var(--primary); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">WEIGHT
                            (KG)</label>
                        <input type="number" id="weight" class="underline-input" placeholder="KG" autocomplete="off"
                            style="font-size: 1.8rem;">
                    </div>

                    <div class="input-group" style="margin-bottom: 30px;">
                        <label
                            style="display: block; color: var(--primary); font-size: 0.7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">HEIGHT
                            (CM)</label>
                        <input type="number" id="height" class="underline-input" placeholder="CM" autocomplete="off"
                            style="font-size: 1.8rem;">
                    </div>
                </main>

                <footer style="margin-top: 30px; text-align: center;">
                    <button class="btn-primary hover-scale" id="next-btn"
                        style="width: 100%; height: 75px; font-size: 1.3rem; border-radius: 100px;">
                        CONTINUE <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                    </button>
                    <p
                        style="color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 20px;">
                        SECURE ENCLAVE ACTIVE
                    </p>
                    <p style="margin-top: 15px; font-size: 0.85rem; color: #666;">
                        Already a member? <a href="login.html"
                            style="color: var(--primary); text-decoration: none; font-weight: 800;">LOG IN</a>
                        <span style="margin: 0 10px; opacity: 0.3;">|</span>
                        <a href="#" id="quick-start"
                            style="color: #444; text-decoration: none; font-weight: 700; font-size: 0.7rem;">GUEST
                            SKIP</a>
                    </p>
                </footer>
            </div>
        </div>
    </div>

    <script type="module">
        const nextBtn = document.getElementById('next-btn');
        const ageInput = document.getElementById('age');
        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');

        if (nextBtn) {
            nextBtn.addEventListener('click', function (e) {
                const name = document.getElementById('ring_name').value.trim();
                const phone = document.getElementById('phone_number').value.trim();
                const age = ageInput.value.trim();
                const weight = weightInput.value.trim();
                const height = heightInput.value.trim();

                if (!name || !phone || !age || !weight || !height) {
                    alert('Complete your profile, fighter.');
                    return;
                }

                try {
                    const existingData = localStorage.getItem('boxing_onboarding_data');
                    const data = existingData ? JSON.parse(existingData) : {};

                    data.ring_name = name;
                    data.phone_number = phone;
                    data.user_metrics = {
                        age: parseInt(age),
                        weight: parseFloat(weight),
                        height: parseFloat(height)
                    };
                    localStorage.setItem('boxing_onboarding_data', JSON.stringify(data));

                    if (window.AudioEngine) {
                        AudioEngine.playTransition();
                    }

                    nextBtn.style.transform = 'scale(0.95)';
                    nextBtn.innerText = 'PROFILING...';
                    nextBtn.disabled = true;

                    setTimeout(() => {
                        window.location.href = 'goals.html';
                    }, 600);
                } catch (error) {
                    console.error('Error saving metrics:', error);
                }
            });
        }

        const quickStart = document.getElementById('quick-start');
        if (quickStart) {
            quickStart.addEventListener('click', (e) => {
                e.preventDefault();
                const mockData = {
                    ring_name: "FIGHTER",
                    user_metrics: { age: 25, weight: 80, height: 180 },
                    onboarding_complete: true
                };
                localStorage.setItem('boxing_onboarding_data', JSON.stringify(mockData));
                localStorage.setItem('boxing_guru_logged_in', 'true');
                window.location.href = 'dashboard.html';
            });
        }
    </script>
</body>

</html>
