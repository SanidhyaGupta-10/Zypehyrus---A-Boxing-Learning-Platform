<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mental Trigger - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="onboarding-body-lock onboarding-layout">
    <div class="app-container dashboard-bg">
        <div class="onboarding-content">
            <div class="page animate-fade anim-slide-right"
                style="padding: 0; min-height: auto; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <header class="header animate-slide-up hover-scale" style="text-align: left; margin-bottom: 15px;">
                    <div
                        style="font-size: 0.8rem; font-weight: 800; letter-spacing: 4px; color: var(--primary); margin-bottom: 12px; text-transform: uppercase;">
                        ONBOARDING 08/10</div>
                    <h1 style="font-size: 2.3rem; font-weight: 700; line-height: 1.1; color: var(--text);">What is your
                        <br><span class="text-neon" style="font-style: italic;">Core Driver?</span>
                    </h1>
                    <p style="color: var(--text-muted); margin-top: 10px; font-size: 0.9rem; line-height: 1.4;">Identify
                        what keeps you moving during deep fatigue.</p>
                </header>

                <main class="animate-slide-up hover-scale"
                    style="animation-delay: 0.1s; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-content: center;">
                    <div class="bubble-btn" onclick="selectTrigger(this, 'Stress Relief')">
                        <i class="fa-solid fa-brain"></i>
                        <span>STRESS RELIEF</span>
                    </div>

                    <div class="bubble-btn active" onclick="selectTrigger(this, 'Pro Ambitions')">
                        <i class="fa-solid fa-trophy"></i>
                        <span>PRO AMBITIONS</span>
                    </div>

                    <div class="bubble-btn" onclick="selectTrigger(this, 'Self Defense')">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>SELF DEFENSE</span>
                    </div>

                    <div class="bubble-btn" onclick="selectTrigger(this, 'Pure Aesthetics')">
                        <i class="fa-solid fa-dumbbell"></i>
                        <span>AESTHETICS</span>
                    </div>
                </main>

                <footer style="margin-top: 25px; text-align: center;">
                    <button id="next-btn" class="btn-primary hover-scale"
                        style="width: 100%; height: 75px; border-radius: 100px; font-size: 1.2rem;">
                        CHOOSE PURPOSE <i class="fa-solid fa-arrow-right" style="margin-left: 10px;"></i>
                    </button>
                    <a href="stance.html"
                        style="display: block; text-decoration: none; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; font-size: 0.65rem; margin-top: 15px;">BACK</a>
                </footer>
            </div>
        </div>
    </div>

    <style>
        .bubble-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .bubble-btn i {
            font-size: 1.5rem;
            color: var(--primary);
            opacity: 0.5;
            transition: 0.3s;
        }

        .bubble-btn span {
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .bubble-btn.active {
            border-color: var(--primary);
            background: rgba(var(--primary-rgb), 0.05);
        }

        .bubble-btn.active i {
            opacity: 1;
            transform: scale(1.2);
        }

        .bubble-btn.active span {
            color: var(--primary);
        }
    </style>

    <script type="module">
        let selectedTrigger = 'Pro Ambitions';
        window.selectTrigger = function (el, trigger) {
            document.querySelectorAll('.bubble-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedTrigger = trigger;
        }
        document.getElementById('next-btn').onclick = function () {
            const data = JSON.parse(localStorage.getItem('boxing_onboarding_data') || '{}');
            data.trigger = selectedTrigger;
            localStorage.setItem('boxing_onboarding_data', JSON.stringify(data));
            window.location.href = 'intensity.html';
        };
    </script>
</body>

</html>
