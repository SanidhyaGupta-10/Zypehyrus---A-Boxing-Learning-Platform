<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Depolyment - Aerial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .uplink-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            background: radial-gradient(circle at top right, rgba(226, 255, 59, 0.05), transparent 40%);
        }

        .back-nav {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-bottom: 40px;
            cursor: pointer;
        }

        .protocol-type {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.8;
            border-left: 3px solid var(--primary);
            padding-left: 15px;
        }

        .protocol-main-title {
            font-size: 4rem;
            font-weight: 950;
            font-style: italic;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 30px;
            letter-spacing: -2px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 50px;
        }

        .meta-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 25px;
        }

        .meta-label {
            font-size: 0.6rem;
            color: var(--zinc-500);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
        }

        .briefing-card {
            background: rgba(226, 255, 59, 0.03);
            border: 1px solid rgba(226, 255, 59, 0.1);
            border-radius: 35px;
            padding: 30px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .briefing-card::before {
            content: '\f135';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 8rem;
            opacity: 0.03;
            color: var(--primary);
        }

        .briefing-title {
            font-size: 1.2rem;
            font-weight: 950;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .briefing-text {
            color: #bbb;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .impact-meter {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 20px;
            position: relative;
        }

        .impact-fill {
            position: absolute;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            border-radius: 10px;
        }

        .start-btn {
            margin-top: auto;
            width: 100%;
            height: 90px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 100px;
            font-size: 1.5rem;
            font-weight: 950;
            font-style: italic;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 15px 50px rgba(var(--primary-rgb), 0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .loading-glitch {
            font-family: monospace;
            font-size: 0.6rem;
            color: var(--primary);
            text-align: center;
            margin-top: 20px;
            opacity: 0.5;
            letter-spacing: 2px;
        }
    </style>
</head>

<body style="background: #000;">
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 24px;">
            <div class="uplink-container">
                <div class="back-nav" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>

                <div id="protocol-mount">
                    <!-- Data Injected -->
                    <div class="protocol-type">Loading Deployment...</div>
                    <h1 class="protocol-main-title">Establishing<br>Neural Uplink</h1>
                </div>

                <div class="meta-grid">
                    <div class="meta-box">
                        <div class="meta-label">Duration</div>
                        <div class="meta-value" id="p-duration">-- MIN</div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-label">Time</div>
                        <div class="meta-value" id="p-time">-- AM</div>
                    </div>
                </div>

                <div class="briefing-card">
                    <div class="briefing-title">MISSION BRIEFING</div>
                    <p class="briefing-text" id="p-briefing">Calculated protocol based on your primary boxing dominance
                        strategy. Focus on absolute precision and technical velocity.</p>
                    <div class="meta-label" style="margin-top: 25px;">STRATEGIC IMPACT</div>
                    <div class="impact-meter">
                        <div class="impact-fill" style="width: 85%;"></div>
                    </div>
                </div>

                <button class="start-btn" id="deploy-btn">
                    DEPLOY PROTOCOL <i class="fa-solid fa-bolt"></i>
                </button>

                <div class="loading-glitch" id="glitch-text">AUTHENTICATING_USER_X82...</div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const params = new URLSearchParams(window.location.search);
                    const dayIdx = params.get('day');
                    const pIdx = params.get('p');
                    const plan = JSON.parse(localStorage.getItem('active_boxing_plan_v2'));

                    if (plan && dayIdx !== null && pIdx !== null) {
                        const day = plan.days[dayIdx];
                        const protocol = day.protocol[pIdx];

                        document.getElementById('protocol-mount').innerHTML = `
                            <div class="protocol-type">${protocol.impact}</div>
                            <h1 class="protocol-main-title">${protocol.title.replace(': ', '<br>')}</h1>
                        `;

                        document.getElementById('p-duration').innerText = protocol.duration;
                        document.getElementById('p-time').innerText = protocol.time;

                        document.getElementById('deploy-btn').onclick = () => {
                            // 1. Add to Deployed Planner Drills
                            const todayKey = new Date().toDateString();
                            const storageKey = 'deployed_planner_drills_' + todayKey;
                            const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');

                            // Check if already deployed
                            const isNew = !existing.some(d => d.title === protocol.title);
                            if (isNew) {
                                existing.push({
                                    ...protocol,
                                    deployed_at: Date.now(),
                                    isPlanner: true
                                });
                                localStorage.setItem(storageKey, JSON.stringify(existing));
                            }

                            // 2. Play Sound
                            if (window.AppSounds) AppSounds.play('success');

                            // 3. Redirect back to planner with success or go to dashboard
                            alert("STRATEGY DEPLOYED: Drill added to today's Daily Grind.");
                            window.location.href = 'dashboard.html';
                        };

                        // Random fun glitch text
                        const glitches = ["UPLINKING_STRATEGY...", "CALCULATING_IMPACT...", "READY_FOR_DEPLOYMENT", "ENGINE_PRIMED_X99"];
                        document.getElementById('glitch-text').innerText = glitches[Math.floor(Math.random() * glitches.length)];
                    }
                });
            </script>
        </div>
    </div>
</body>

</html>
