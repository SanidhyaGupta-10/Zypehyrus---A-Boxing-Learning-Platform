<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Session - Aerial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .protocol-page {
            background: linear-gradient(180deg, #0a0a0c 0%, #000 100%);
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .hud-header {
            padding: 30px 24px 20px;
            border-bottom: 1px solid rgba(226, 255, 59, 0.1);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .hud-title {
            font-size: 2.2rem;
            font-weight: 950;
            color: var(--primary);
            text-transform: uppercase;
            font-style: italic;
            line-height: 0.95;
            text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.3);
            margin-top: 10px;
            letter-spacing: -1px;
        }

        .hud-subtitle {
            font-family: monospace;
            color: var(--zinc-500);
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .progress-hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .hud-percent {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
        }

        .hud-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin-left: 15px;
            margin-right: 15px;
            position: relative;
        }

        .hud-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            width: 0%;
            transition: width 0.5s;
        }

        .protocol-list-container {
            padding: 24px;
        }

        .p-drill-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px 30px 30px 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .p-drill-card.completed {
            border-left-color: var(--primary);
            background: rgba(226, 255, 59, 0.02);
            opacity: 0.6;
        }

        .p-drill-status {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            font-size: 0.8rem;
        }

        .p-drill-card.completed .p-drill-status {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.4);
        }

        .p-drill-info {
            flex: 1;
        }

        .p-drill-name {
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 4px;
        }

        .p-drill-meta {
            font-size: 0.7rem;
            color: var(--primary);
            font-family: monospace;
            letter-spacing: 1px;
        }

        .p-drill-card.completed .p-drill-meta {
            color: var(--zinc-500);
        }

        .system-msg {
            text-align: center;
            font-family: monospace;
            color: var(--zinc-500);
            font-size: 0.65rem;
            margin-top: 30px;
            opacity: 0.5;
        }

        .abandon-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 40px;
            color: #ff4444;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .protocol-complete-banner {
            display: none;
            margin: 0 24px 20px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(var(--primary-rgb), 0.12);
            border: 1px solid rgba(var(--primary-rgb), 0.35);
            text-align: center;
        }

        .protocol-complete-banner.visible {
            display: block;
        }

        .protocol-complete-banner h3 {
            margin: 0 0 8px;
            font-size: 0.9rem;
            font-weight: 950;
            color: var(--primary);
            text-transform: uppercase;
        }

        .protocol-complete-banner p {
            margin: 0;
            font-size: 0.75rem;
            color: #aaa;
        }

        .start-protocol-btn {
            display: block;
            width: calc(100% - 48px);
            margin: 0 24px 20px;
            padding: 18px;
            border: none;
            border-radius: 100px;
            background: var(--primary);
            color: #000;
            font-weight: 950;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(var(--primary-rgb), 0.35);
        }

        .hud-percent-label {
            font-size: 0.55rem;
            color: var(--zinc-500);
            font-weight: 900;
            letter-spacing: 1px;
        }
    </style>
</head>

<body style="background: #000; margin: 0;">
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained">
            <div class="protocol-page">
                <div class="hud-header">
                    <div class="action-circle hover-scale" onclick="window.history.back()"
                        style="width: 35px; height: 35px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 20px;">
                        <i class="fa-solid fa-arrow-left"></i>
                    </div>
                    <div class="hud-subtitle">STRATEGY DEPLOYMENT</div>
                    <div class="hud-title" id="p-title">LOADING...</div>

                    <div class="progress-hud">
                        <div class="hud-percent" id="p-pct">0%</div>
                        <div class="hud-track">
                            <div class="hud-fill" id="p-fill"></div>
                        </div>
                        <div class="hud-percent-label" id="p-progress-label">DRILLS DONE</div>
                    </div>
                </div>

                <div class="protocol-complete-banner" id="complete-banner">
                    <h3><i class="fa-solid fa-check-double"></i> BLOCK COMPLETE</h3>
                    <p>All exercises finished. This protocol is logged to your grind.</p>
                </div>

                <button type="button" class="start-protocol-btn ripple" id="start-protocol-btn" style="display: none;">
                    <i class="fa-solid fa-play"></i> START BLOCK
                </button>

                <div class="protocol-list-container" id="drill-list">
                    <!-- Drills injected here -->
                </div>

                <div class="system-msg">AI ENGINE ACTIVE. ADAPTIVE LOGIC ENGAGED.</div>
                <a href="planner.html" class="abandon-btn">ABORT PROTOCOL</a>
            </div>

            <script src="protocol-session-utils.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const params = new URLSearchParams(window.location.search);
                    const dayIdx = params.get('day');
                    const pIdx = params.get('p');
                    const PS = window.ProtocolSession;
                    const plan = JSON.parse(localStorage.getItem('active_boxing_plan_v2') || 'null');

                    if (!plan || dayIdx === null || pIdx === null || !PS) {
                        document.getElementById('p-title').innerText = 'ERROR: NO DATA';
                        return;
                    }

                    const protocolData = plan.days[dayIdx].protocol[pIdx];
                    const drills = PS.cacheDrills(dayIdx, pIdx);
                    const completedIndices = PS.getCompletedIndices(dayIdx, pIdx);
                    const allComplete = PS.isProtocolFullyComplete(dayIdx, pIdx);

                    if (params.get('finished') === '1' && completedIndices.length >= drills.length) {
                        PS.markProtocolFullyComplete(dayIdx, pIdx);
                    }

                    const dayType = plan.days[dayIdx].day_type || protocolData.day_type || '';
                    document.getElementById('p-title').innerHTML =
                        (dayType ? `<span style="font-size:0.5em;color:var(--primary);">${dayType}</span><br>` : '') +
                        protocolData.title.replace(': ', '<br>');

                    const list = document.getElementById('drill-list');
                    list.innerHTML = '';

                    let completedCount = 0;

                    drills.forEach((drill, index) => {
                        const isComplete = completedIndices.includes(index);
                        if (isComplete) completedCount++;

                        const div = document.createElement('div');
                        div.className = `p-drill-card ripple hover-scale ${isComplete ? 'completed' : ''}`;
                        div.onclick = () => {
                            window.location.href =
                                `session-timer.html?index=${index}&source=protocol&day=${dayIdx}&p=${pIdx}&autostart=1`;
                        };

                        div.innerHTML = `
                        <div class="p-drill-status">
                            ${isComplete ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-bolt"></i>'}
                        </div>
                        <div class="p-drill-info">
                            <div class="p-drill-name">${drill.name}</div>
                            <div class="p-drill-meta">
                                <i class="fa-regular fa-clock"></i> ${drill.duration} SEC PER SET
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color: rgba(255,255,255,0.2); font-size: 0.8rem;"></i>`;
                        list.appendChild(div);
                    });

                    let firstIncomplete = drills.findIndex((_, i) => !completedIndices.includes(i));
                    if (firstIncomplete < 0) firstIncomplete = 0;

                    const finalComplete = PS.isProtocolFullyComplete(dayIdx, pIdx);
                    const percent = drills.length
                        ? Math.round((completedCount / drills.length) * 100)
                        : 0;

                    document.getElementById('p-pct').innerText = `${completedCount}/${drills.length}`;
                    document.getElementById('p-progress-label').innerText = finalComplete
                        ? 'BLOCK COMPLETE'
                        : 'DRILLS DONE';
                    setTimeout(() => {
                        document.getElementById('p-fill').style.width = `${percent}%`;
                    }, 100);

                    const banner = document.getElementById('complete-banner');
                    const startBtn = document.getElementById('start-protocol-btn');
                    if (finalComplete) {
                        banner.classList.add('visible');
                        startBtn.style.display = 'none';
                    } else {
                        banner.classList.remove('visible');
                        startBtn.style.display = 'block';
                        startBtn.onclick = () => {
                            window.location.href =
                                `session-timer.html?index=${firstIncomplete}&source=protocol&day=${dayIdx}&p=${pIdx}&autostart=1`;
                        };
                    }
                });
            </script>
        </div>
    </div>
    </div>
</body>

</html>
