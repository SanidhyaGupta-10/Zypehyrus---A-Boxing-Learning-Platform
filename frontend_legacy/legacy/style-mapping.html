<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Mapping - AI Boxing Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container dashboard-bg">
        <div class="mobile-constrained" style="padding: 40px 20px;">
            <div class="page animate-fade anim-slide-right">
                <header class="header animate-slide-up hover-scale">
                    <h1 class="text-gradient">Style Match</h1>
                    <p>Based on your profile, your fighting DNA matches a legend.</p>
                </header>

                <main class="animate-slide-up hover-scale" style="animation-delay: 0.1s; text-align: center;">
                    <div class="hero-match" style="margin-bottom: var(--spacing-xl);">
                        <div class="glass-card"
                            style="padding: 40px var(--spacing-lg); position: relative; overflow: hidden;">
                            <div
                                style="position: absolute; top: -20px; right: -20px; font-size: 8rem; opacity: 0.05; color: var(--primary);">
                                ????</div>
                            <div
                                style="font-size: 0.9rem; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">
                                Your Hero Match</div>
                            <h2 style="font-size: 3rem; margin: 10px 0;">The Catalyst</h2>
                            <p style="color: var(--text-muted); font-size: 1.1rem;">Precision. Speed. Relentless Focus.
                            </p>

                            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                                <div class="stat">
                                    <div style="color: var(--primary); font-weight: 800;">94%</div>
                                    <div style="font-size: 0.7rem; color: var(--text-muted);">PRECISION</div>
                                </div>
                                <div class="stat">
                                    <div style="color: var(--primary); font-weight: 800;">88%</div>
                                    <div style="font-size: 0.7rem; color: var(--text-muted);">SPEED</div>
                                </div>
                                <div class="stat">
                                    <div style="color: var(--primary); font-weight: 800;">91%</div>
                                    <div style="font-size: 0.7rem; color: var(--text-muted);">DEFENSE</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="location.href='enter-ring.html'">
                            Enter The Ring <i class="fa-solid fa-person-running"></i>
                        </button>
                    </div>
                </main>
            </div>
        </div>
    </div>
</body>

</html>
